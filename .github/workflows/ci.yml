name: CI
jobs:
  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Select relevant checks
      id: changes
      env:
        CI_PROFILE: squares
      run: python3 .github/scripts/ci_changes.py
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
      if: steps.changes.outputs.code == 'true'
    - run: node --check static/js/game.js
      if: steps.changes.outputs.code == 'true'
    - run: node --test tests/*.test.cjs
      if: steps.changes.outputs.code == 'true'
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Select relevant checks
      id: changes
      env:
        CI_PROFILE: squares
      run: python3 .github/scripts/ci_changes.py
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml
      if: steps.changes.outputs.code == 'true'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
      if: steps.changes.outputs.code == 'true'
    - name: Run flake8
      run: |
        # Stop the build on syntax errors or undefined names.
        # Allow line-length up to 120 and ignore common style nitpicks
        # so existing code doesn't fail on first run.
        flake8 app.py config.py database.py \
          --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app.py config.py database.py \
          --count --max-line-length=120 --statistics \
          --ignore=E501,W503,E302,E303,E305,W291,W293,W292,E128,E126,E127,E111,W504
      if: steps.changes.outputs.code == 'true'
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.10'
        - '3.12'
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Select relevant checks
      id: changes
      env:
        CI_PROFILE: squares
      run: python3 .github/scripts/ci_changes.py
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
      if: steps.changes.outputs.code == 'true'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"
      if: steps.changes.outputs.code == 'true'
    - name: Run tests with coverage
      run: |
        python -m pytest tests/ -v \
          --cov=app --cov=config --cov=database \
          --cov-report=term-missing \
          --cov-fail-under=80
      if: steps.changes.outputs.code == 'true'
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pip-audit
    - name: Run pip-audit
      run: pip-audit
'on':
  push:
    branches:
    - main
    - master
  pull_request:
    branches:
    - main
    - master
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
