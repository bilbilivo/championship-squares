name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          # Stop the build on syntax errors or undefined names.
          # Allow line-length up to 120 and ignore common style nitpicks
          # so existing code doesn't fail on first run.
          flake8 app.py config.py database.py \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app.py config.py database.py \
            --count --max-line-length=120 --statistics \
            --ignore=E501,W503,E302,E303,E305,W291,W293,W292,E128,E126,E127,E111,W504

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=app --cov=config --cov=database \
            --cov-report=term-missing \
            --cov-fail-under=80

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit
