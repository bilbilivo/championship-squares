<!DOCTYPE html>
<html>
<head>
    <title>Super Bowl Squares</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
/* Root Variables */
:root {
    --retro-green: #00ff00;
    --retro-dark: #002200;
    --retro-light: #88ff88;
    --pixel-border: 2px solid var(--retro-green);
    --grid-bg: #001100;
}

/* Base Styles */
body {
    font-family: 'Press Start 2P', monospace;
    background: var(--retro-dark);
    color: var(--retro-green);
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    box-sizing: border-box;
    text-shadow: 2px 2px var(--retro-dark);
}

/* Layout Structure */
.container {
    height: 100vh;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
    gap: 10px;
    padding: 10px;
    box-sizing: border-box;
    image-rendering: pixelated;
    overflow: hidden;
}

.title {
    text-align: center;
    color: var(--retro-green);
    font-size: 2em;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 2px;
    animation: blink 2s infinite;
}

.controls {
    text-align: center;
    border: var(--pixel-border);
    padding: 10px;
    background: var(--grid-bg);
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.main-content {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 20px;
    min-height: 0;
    height: calc(100vh - 200px);
}

/* Grid Container */
.grid-container {
    height: 100%;
    min-height: 600px;
    background: var(--grid-bg);
    border: var(--pixel-border);
    padding: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 4px 4px 0 var(--retro-green);
    flex-grow: 1;
}

/* Legend Container */
.legend-container {
    height: 100%;
    background: var(--grid-bg);
    border: var(--pixel-border);
    padding: 20px;
    overflow-y: auto;
    box-shadow: 4px 4px 0 var(--retro-green);
}

/* Team Selection Styles */
.team-selector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 15px;
    border: var(--pixel-border);
    background: var(--grid-bg);
    margin: 0;
}

.team-vs {
    color: var(--retro-green);
    font-size: 1.2em;
}

.team-selection {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* Helmet Icon */
.helmet-icon {
    width: 64px;
    height: 64px;
    image-rendering: pixelated;
}

/* Select Dropdowns */
select {
    background: var(--retro-dark);
    color: var(--retro-green);
    border: var(--pixel-border);
    padding: 6px;
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    cursor: pointer;
    min-width: 200px;
}

select option {
    background: var(--retro-dark);
    color: var(--retro-green);
    font-size: 20px;
    padding: 6px;
}

/* Button Styles */
button {
    background: var(--retro-green);
    color: var(--retro-dark);
    border: 2px solid var(--retro-light);
    padding: 10px 20px;
    margin: 0 10px;
    font-family: 'Press Start 2P', monospace;
    cursor: pointer;
    text-transform: uppercase;
    font-size: 12px;
    box-shadow: 2px 2px 0 var(--retro-dark);
}

button:hover {
    background: var(--retro-light);
    transform: translateY(-2px);
}

button:active {
    transform: translateY(2px);
    box-shadow: none;
}

/* Animations */
@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

.grid-container::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--retro-green);
    opacity: 0.1;
    animation: scanline 8s linear infinite;
    pointer-events: none;
}

@keyframes scanline {
    0% { transform: translateY(0); }
    100% { transform: translateY(100%); }
}

/* Grid Elements */
.square {
    stroke: var(--retro-green);
    stroke-width: 2;
    fill: var(--grid-bg);
    transition: fill 0.3s ease;
}

.square:hover {
    fill: var(--retro-light);
    cursor: pointer;
}

.square.tie-square {
    fill: var(--grid-bg) !important;
    cursor: not-allowed !important;
}

.square.tie-square:hover {
    fill: var(--grid-bg) !important;
}

/* Axis Styles */
.axis line,
.axis path {
    stroke: var(--retro-green);
    stroke-width: 1;
}

.axis text {
    fill: var(--retro-green);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
}


/* Square Text */
.square-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    fill: var(--retro-green);
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
}

/* Tooltip */
.tooltip {
    position: absolute;
    background: var(--retro-dark);
    border: 2px solid var(--retro-green);
    padding: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--retro-green);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 1000;
    box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
}

/* Player Management */
.player-form {
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: var(--pixel-border);
    padding: 10px;
    background: var(--grid-bg);
}

.player-form input {
    background: var(--retro-dark);
    border: var(--pixel-border);
    padding: 8px;
    color: var(--retro-green);
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
}

/* Player List Styles */
.player-list {
    display: flex !important;
    flex-direction: column !important;
    gap: 4px !important;
    margin: 0 !important;
    padding: 0 !important;
}

.player-item {
    display: flex !important;
    align-items: center !important;
    gap: 4px !important;
    padding: 4px !important;
    margin: 0 !important;
    background: var(--retro-dark) !important;
    border: 2px solid var(--retro-green) !important;
    height: 28px !important;
}

.player-info {
    font-size: 12px !important;
    line-height: 1.2 !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    max-width: 150px !important;
    margin: 0 !important;
    padding: 0 !important;
}

.color-dot {
    width: 14px !important;
    height: 14px !important;
    border: 2px solid var(--retro-green) !important;
    flex-shrink: 0 !important;
    margin: 0 3px !important;
}

.delete-btn {
    margin-left: auto !important;
    min-width: 20px !important;
    height: 20px !important;
    padding: 2px !important;
    font-size: 10px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    margin-right: 2px !important;
}
/* Scrollbar Styling */
::-webkit-scrollbar {
    width: 12px;
    height: 12px;
}

::-webkit-scrollbar-track {
    background: var(--retro-dark);
    border: var(--pixel-border);
}

::-webkit-scrollbar-thumb {
    background: var(--retro-green);
    border: 2px solid var(--retro-dark);
}

::-webkit-scrollbar-thumb:hover {
    background: var(--retro-light);
}

/* Media Queries for Responsiveness */
@media (max-width: 1200px) {
    .main-content {
        grid-template-columns: 1fr 250px;
    }
    
    .grid-container {
        min-height: 500px;
    }
}

@media (max-width: 768px) {
    .main-content {
        grid-template-columns: 1fr;
        height: auto;
    }
    
    .grid-container {
        min-height: 400px;
    }
    
    .legend-container {
        height: 300px;
    }
    
    .team-selector {
        flex-direction: column;
        padding: 10px;
    }
    
    .team-selection {
        width: 100%;
        justify-content: center;
    }
}

/* Team Name Background Highlights */
.team-name-background {
    fill: var(--retro-dark);
    opacity: 0.8;
}

/* Axis Label Positioning */
.axis-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    fill: var(--retro-green);
}

.axis-label.left {
    text-anchor: end;
}

.axis-label.right {
    text-anchor: start;
}

.header-square {
    cursor: default;
}

.header-text {
    pointer-events: none;
    font-family: 'Press Start 2P', monospace;
}

/* Adjust margins to account for score cells */
.grid-container {
    padding: 40px;  /* Increased padding to accommodate score cells */
}

/* Update team name positioning */
.team-name.vertical {
    transform: rotate(-90deg);
    transform-origin: left center;
}

/* Static Team Names */
.team-name-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 28px;
    padding: 10px;
    background-color: var(--retro-dark);
    z-index: 20;  /* Higher z-index to appear above left team name */
}

.team-name-left {
    position: absolute;
    left: 0;
    top: 50%;
    width: calc(100vh - 80px);
    transform-origin: 0 0;
    transform: rotate(-90deg) translateX(-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 28px;
    padding: 10px;
    background-color: var(--retro-dark);
    white-space: nowrap;
    z-index: 10;  /* Lower z-index to appear below top team name */
    text-align: center;
}

.delete-btn {
	margin-left: auto;
	min-width: 24px;
	height: 24px;
	padding: 0;
	display: flex;
	align-items: center;
	justify-content: center;
}

.reset-game-btn {
	background-color: #8B0000;
	color: var(--retro-green);
	border-color: var(--retro-light);
}

.reset-game-btn:hover {
	background-color: #A00000;
}
.legend-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    justify-content: space-between;
}

.landing-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--retro-dark);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.landing-content {
    text-align: center;
    padding: 40px;
    border: var(--pixel-border);
    background: var(--grid-bg);
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
    animation: glow 2s infinite alternate;
}

.landing-title {
    color: var(--retro-green);
    font-size: 3em;
    margin-bottom: 40px;
    text-transform: uppercase;
    letter-spacing: 4px;
    animation: blink 2s infinite;
}

.landing-buttons {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
}

.landing-btn {
    background: var(--retro-dark);
    color: var(--retro-green);
    border: var(--pixel-border);
    padding: 15px 30px;
    font-family: 'Press Start 2P', monospace;
    font-size: 1.2em;
    cursor: pointer;
    width: 240px;
    transition: all 0.3s ease;
}

.landing-btn:hover {
    background: var(--retro-green);
    color: var(--retro-dark);
    transform: translateY(-2px);
    box-shadow: 0 4px 0 var(--retro-dark);
}

.landing-btn:active {
    transform: translateY(2px);
    box-shadow: none;
}

@keyframes glow {
    from {
        box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
    }
    to {
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
    }
}

/* Add loading spinner styles */
.loading-spinner {
    width: 50px;
    height: 50px;
    border: 4px solid var(--retro-dark);
    border-top: 4px solid var(--retro-green);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 20px auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.score {
  cursor: pointer;
  padding: 8px;
  font-family: 'Press Start 2P', monospace;
  font-size: 2.5em;
  color: #E7E7A7;
  min-width: 70px;
  text-align: center;
  margin: 0 20px;
  background: #000000;
  border: none;
  position: relative;
  letter-spacing: 2px;
  text-shadow: 
    0 0 4px rgba(170, 255, 0, 0.4),
    0 0 8px rgba(170, 255, 0, 0.2);
  image-rendering: pixelated;
}

.score:hover {
  color: #E5D820;
  text-shadow: 
    0 0 6px rgba(170, 255, 0, 0.6),
    0 0 12px rgba(170, 255, 0, 0.3);
}

/* Remove any existing borders or box shadows */
.score::before,
.score::after {
  display: none;
}
.highlight {
  fill: var(--retro-light) !important;
}
/* Alert Overlay */
.alert-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--retro-dark);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Alert Content */
.alert-content {
    text-align: center;
    padding: 40px;
    border: var(--pixel-border);
    background: var(--grid-bg);
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
    animation: glow 2s infinite alternate;
}

/* Alert Title */
.alert-title {
    color: var(--retro-green);
    font-size: 2em;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
    animation: blink 2s infinite;
}

/* Alert Message */
.alert-message {
    color: var(--retro-green);
    font-size: 1.2em;
    margin-bottom: 30px;
}

/* Alert Buttons */
.alert-buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
}

.alert-btn {
    background: var(--retro-dark);
    color: var(--retro-green);
    border: var(--pixel-border);
    padding: 15px 30px;
    font-family: 'Press Start 2P', monospace;
    font-size: 1.2em;
    cursor: pointer;
    transition: all 0.3s ease;
}

.alert-btn:hover {
    background: var(--retro-green);
    color: var(--retro-dark);
    transform: translateY(-2px);
    box-shadow: 0 4px 0 var(--retro-dark);
}

.alert-btn:active {
    transform: translateY(2px);
    box-shadow: none;
}
.prompt-input {
    background: var(--retro-dark);
    border: var(--pixel-border);
    padding: 8px;
    color: var(--retro-green);
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    margin: 20px 0;
    width: 80%;
    text-align: center;
    text-transform: uppercase;
}

.player-list-prompt {
    max-height: 150px;
    overflow-y: auto;
    margin: 10px 0;
    padding: 10px;
    border: var(--pixel-border);
    background: var(--retro-dark);
    text-align: left;
}

.alert-message {
    margin: 20px 0;
    line-height: 1.5;
    white-space: pre-line;
}

/* Base overlay styles */
.base-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;  /* Hidden by default */
    align-items: center;
    justify-content: center;
    background: rgba(0, 34, 0, 0.9);  /* Slightly transparent background */
}

/* Landing overlay - lowest layer */
.landing-overlay {
    composes: base-overlay;
    z-index: 1000;
}

/* Prompt overlay - middle layer */
.generic-prompt {
    composes: base-overlay;
    z-index: 2000;
}

/* Alert overlay - top layer */
.alert-overlay {
    composes: base-overlay;
    z-index: 3000;
    background: rgba(0, 34, 0, 0.95);  /* Slightly more opaque */
}

/* Content containers */
.overlay-content {
    text-align: center;
    padding: 40px;
    border: 2px solid var(--retro-green);
    background: var(--grid-bg);
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
    animation: glow 2s infinite alternate;
    max-width: 90%;
    max-height: 90vh;
    overflow-y: auto;
}

/* Title styles */
.overlay-title {
    color: var(--retro-green);
    font-size: 2em;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
    animation: blink 2s infinite;
}

/* Message styles */
.overlay-message {
    color: var(--retro-green);
    font-size: 1.2em;
    margin: 20px 0;
    line-height: 1.5;
    white-space: pre-line;
}

/* Button container */
.overlay-buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 20px;
}

/* Button styles */
.overlay-btn {
    background: var(--retro-dark);
    color: var(--retro-green);
    border: 2px solid var(--retro-green);
    padding: 15px 30px;
    font-family: 'Press Start 2P', monospace;
    font-size: 1.2em;
    cursor: pointer;
    transition: all 0.3s ease;
}

.overlay-btn:hover {
    background: var(--retro-green);
    color: var(--retro-dark);
    transform: translateY(-2px);
    box-shadow: 0 4px 0 var(--retro-dark);
}

.overlay-btn:active {
    transform: translateY(2px);
    box-shadow: none;
}

/* Input field styles */
.overlay-input {
    background: var(--retro-dark);
    border: 2px solid var(--retro-green);
    padding: 8px;
    color: var(--retro-green);
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    margin: 20px 0;
    width: 80%;
    text-align: center;
    text-transform: uppercase;
}

/* Player list in prompt */
.overlay-player-list {
    max-height: 150px;
    overflow-y: auto;
    margin: 10px 0;
    padding: 10px;
    border: 2px solid var(--retro-green);
    background: var(--retro-dark);
    text-align: left;
    font-size: 0.8em;
}

/* Scrollbar styles for overlays */
.overlay-content::-webkit-scrollbar {
    width: 8px;
}

.overlay-content::-webkit-scrollbar-track {
    background: var(--retro-dark);
}

.overlay-content::-webkit-scrollbar-thumb {
    background: var(--retro-green);
    border: 1px solid var(--retro-dark);
}

/* Animations */
@keyframes overlayFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.base-overlay {
    animation: overlayFadeIn 0.3s ease-out;
}
    </style>
</head>
<body>
    <div id="landing-overlay" class="landing-overlay">
		<div class="landing-content">
			<h1 class="landing-title">Super Bowl Squares</h1>
			<div class="landing-buttons">
				<button id="newGameBtn" class="landing-btn">New Game</button>
				<button id="loadGameBtn" class="landing-btn">Load Game</button>
			</div>
		</div>
	</div>
	<div id="genericAlert" class="alert-overlay" style="display: none;">
		<div class="alert-content">
			<h2 id="genericAlertTitle" class="alert-title">Alert</h2>
			<p id="genericAlertMessage" class="alert-message"></p>
			<div class="alert-buttons">
				<button id="genericAlertOkBtn" class="alert-btn">OK</button>
				<button id="genericAlertCancelBtn" class="alert-btn" style="display: none;">Cancel</button>
			</div>
		</div>
	</div>

	<div id="genericPrompt" class="alert-overlay" style="display: none;">
		<div class="alert-content">
			<h2 id="genericPromptTitle" class="alert-title">Input Required</h2>
			<p id="genericPromptMessage" class="alert-message"></p>
			<input type="text" id="genericPromptInput" class="prompt-input" />
			<div id="genericPromptPlayerList" class="player-list-prompt"></div>
			<div class="alert-buttons">
				<button id="genericPromptOkBtn" class="alert-btn">OK</button>
				<button id="genericPromptCancelBtn" class="alert-btn">Cancel</button>
			</div>
		</div>
	</div>
	<div class="container">
        <h1 class="title">Super Bowl Squares</h1>
        <div class="controls">
            <div class="team-selector">
                <div class="team-selection">
                    <img id="leftHelmet" class="helmet-icon" src="data:image/svg+xml," alt="Left Team">
					<select id="teamLeft" onchange="updateTeamColors()">
						<option value="">Select AFC Team</option>
						<option value="BAL" data-colors="#241773,#9E7C0C">Baltimore Ravens</option>
						<option value="BUF" data-colors="#00338D,#C60C30">Buffalo Bills</option>
						<option value="CIN" data-colors="#FB4F14,#000000">Cincinnati Bengals</option>
						<option value="CLE" data-colors="#311D00,#FF3C00">Cleveland Browns</option>
						<option value="DEN" data-colors="#FB4F14,#002244">Denver Broncos</option>
						<option value="HOU" data-colors="#03202F,#A71930">Houston Texans</option>
						<option value="IND" data-colors="#002C5F,#A2AAAD">Indianapolis Colts</option>
						<option value="JAX" data-colors="#006778,#9F792C">Jacksonville Jaguars</option>
						<option value="KC" data-colors="#E31837,#FFB81C">Kansas City Chiefs</option>
						<option value="LAC" data-colors="#0080C6,#FFC20E">Los Angeles Chargers</option>
						<option value="LV" data-colors="#000000,#A5ACAF">Las Vegas Raiders</option>
						<option value="MIA" data-colors="#008E97,#FC4C02">Miami Dolphins</option>
						<option value="NE" data-colors="#002244,#C60C30">New England Patriots</option>
						<option value="NYJ" data-colors="#125740,#FFFFFF">New York Jets</option>
						<option value="PIT" data-colors="#FFB612,#101820">Pittsburgh Steelers</option>
						<option value="TEN" data-colors="#0C2340,#4B92DB">Tennessee Titans</option>
					</select>
                </div>
				<span id="leftScore" class="score scoreboard-digit" onclick="updateScore('left')">0</span>
                <div class="team-vs">VS</div>
                <span id="rightScore" class="score scoreboard-digit" onclick="updateScore('right')">0</span>
                <div class="team-selection">
					<select id="teamRight" onchange="updateTeamColors()">
						<option value="">Select NFC Team</option>
						<option value="ARI" data-colors="#97233F,#FFFFFF">Arizona Cardinals</option>
						<option value="ATL" data-colors="#A71930,#000000">Atlanta Falcons</option>

// Create main group for zoomable content

    .attr("transform", `translate(${margin.left},${margin.top})`);

// Create separate groups for axes

    top: svg.append("g").attr("class", "axis top"),

// Enhanced pan constraints
const getPanBounds = (transform) => {
    const gridWidth = (maxScore + 2) * currentSize;
    const gridHeight = (maxScore + 2) * currentSize;
    
    return {
        minX: Math.min(margin.left, width - gridWidth * transform.k - margin.right),
        maxX: margin.left,
        minY: Math.min(margin.top, height - gridHeight * transform.k - margin.bottom),
        maxY: margin.top
    };
};

function updateAxesPositions(transform) {
    Object.values(axesGroups).forEach(group => {
        group.attr("transform", `translate(${transform.x}, ${transform.y}) scale(${transform.k})`);
    });
}

// Zoom behavior
const zoom = d3.zoom()
    .scaleExtent([0.1, 4])
    .on("zoom", (event) => {
        const transform = event.transform;
        const bounds = getPanBounds(transform);
        
        const clampedX = Math.min(bounds.maxX, Math.max(bounds.minX, transform.x));
        const clampedY = Math.min(bounds.maxY, Math.max(bounds.minY, transform.y));
        
        const clampedTransform = d3.zoomIdentity
            .translate(clampedX, clampedY)
            .scale(transform.k);
        
        mainGroup.attr("transform", clampedTransform);
        updateAxesPositions(clampedTransform);
        zoomLevel = transform.k;
        
        // Update all text sizes
        updateTextSizes(transform.k);

function updateScore(team) {
    // Get team name based on selection
    const teamSelect = document.getElementById(team === 'left' ? 'teamLeft' : 'teamRight');
    const teamCode = teamSelect.value;
    const teamName = teamCode ? NFL_TEAMS[teamCode].name : (team === 'left' ? 'Left' : 'Right') + ' Team';

    showGenericPrompt({
        title: 'Update Score',
        message: `Enter new score for ${teamCode}`,
        inputType: 'number',
        maxLength: 2,
        minValue: 0,
        maxValue: maxScore,
        validateInput: (value) => {
            if (!value) {
                return { isValid: false, message: 'Enter score or cancel' };
            }
            if (!/^\d+$/.test(value)) {
                return { isValid: false, message: 'Enter numbers' };
            }
            const score = parseInt(value);
            if (isNaN(score)) {
                return { isValid: false, message: 'Enter valid number' };
            }
            if (score < 0 || score > maxScore) {
                return { isValid: false, message: `Score between 0 and ${maxScore}` };
            }
            return { isValid: true };
        },
        onConfirm: (value) => {
            const score = parseInt(value);
            
            // Update score
            if (team === 'left') {
                currentLeftScore = score;
                document.getElementById('leftScore').textContent = currentLeftScore;
            } else {
                currentRightScore = score;
                document.getElementById('rightScore').textContent = currentRightScore;
            }

            // Save scores to backend
            fetch('/api/scores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    left: currentLeftScore,
                    right: currentRightScore
                })
            })
            .then(response => response.json())
            .then(data => {
                if (!data.success) {
                    showAlert('Failed to save scores');
                }
                highlightCurrentScore();
            })
            .catch(error => {
                console.error('Error saving scores:', error);
                showAlert('Failed to save scores');
            });
        }
    });
}

// Modified addPlayer function to maintain sorting
function addPlayer() {
    const initialInput = document.getElementById('playerInitial');
    const nameInput = document.getElementById('playerName');
    const initial = initialInput.value.toUpperCase();
    const name = nameInput.value.trim().toUpperCase();

    // Validate initial
    if (initial.length !== 1) {
        showAlert("Enter Initial");
        return;
    }

    // Validate name length and content
    if (!name) {
        showAlert("Enter name");
        return;
    }
    
    if (name.length > 8) {
        showAlert("Name is max 8 char");
        nameInput.value = name.substring(0, 8);
        return;
    }

    // Check for duplicate initial
    if (players[initial]) {
        showAlert(`Initial ${initial} owned by ${players[initial].name}`);
        return;
    }

    // Get next color from Category10 scale
    const playerColor = playerColorScale(Object.keys(players).length);

    // Add player via API
    fetch('/api/players', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initial, name, color: playerColor })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            players[initial] = { name, color: data.color };
            updatePlayerList(); // This will now show the sorted list
            // Clear inputs after successful addition
            initialInput.value = '';
            nameInput.value = '';
        } else {
            showAlert(data.error || "Failed to add player");
        }
    })
    .catch(error => {
        console.error("Error adding player:", error);
        showAlert("Failed to add player");
    });
}

// Add these helper functions for contrast checking
function getLuminance(r, g, b) {
    let [rs, gs, bs] = [r, g, b].map(c => {
        c = c / 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
}

function getContrastRatio(color1, color2) {
    // Convert hex to RGB
    const getRGB = (hex) => {
        const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
        hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null;
    };

    const rgb1 = getRGB(color1);
    const rgb2 = getRGB(color2);
    
    if (!rgb1 || !rgb2) return 1;

    const l1 = getLuminance(rgb1.r, rgb1.g, rgb1.b);
    const l2 = getLuminance(rgb2.r, rgb2.g, rgb2.b);
    
    const lighter = Math.max(l1, l2);
    const darker = Math.min(l1, l2);
    
    return (lighter + 0.05) / (darker + 0.05);
}

function getBestContrastColor(teamColors, backgroundColor = '#001100') {
    let bestColor = teamColors[0];
    let bestContrast = getContrastRatio(backgroundColor, teamColors[0]);
    
    for (let i = 1; i < teamColors.length; i++) {
        const contrast = getContrastRatio(backgroundColor, teamColors[i]);
        if (contrast > bestContrast) {
            bestContrast = contrast;
            bestColor = teamColors[i];
        }
    }
    
    // If contrast is still poor, default to a high-contrast color
    if (bestContrast < 4.5) {  // WCAG AA standard for large text
        return '#00ff00';  // Default to retro green for maximum visibility
    }
    
    return bestColor;
}

        deleteBtn.onclick = () => deletePlayer(initial);
        
        playerItem.appendChild(colorDot);
        playerItem.appendChild(playerInfo);
        playerItem.appendChild(deleteBtn);
        playerList.appendChild(playerItem);
    });
}


function deletePlayer(initial) {
    const playerName = players[initial]?.name || 'Unknown Player';
    
    showAlert(
        `Player: ${initial} - ${playerName}`,
        'Delete Player',
        true,
        (confirmed) => {
            if (confirmed) {
                // Delete player via API
                fetch(`/api/players/${initial}`, {
                    method: 'DELETE',
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Remove from local players object
                        delete players[initial];
                        // Update the player list display
                        updatePlayerList();
                        // Clear any squares with this player's initial
                        d3.selectAll('.square-text')
                            .filter(function() {
                                return d3.select(this).text() === initial;
                            })
                            .each(function() {
                                const row = d3.select(this).attr('data-row');
                                const col = d3.select(this).attr('data-col');
                                updateSquare(row, col, '');
                            });
                    } else {
                        showAlert(data.error || "Failed to delete player");
                    }
                })
                .catch(error => {
                    console.error("Error deleting player:", error);
                    showAlert("Failed to delete player");
                });
            }
        }
    );
}

function handleSquareClick(row, col) {
    if (row === col) return; // Prevent tie square interaction

    const currentValue = d3.select(`text[data-row='${row}'][data-col='${col}']`).text();
    if (currentValue) {
        showAlert(`Owned by ${currentValue}`, 'Square taken');
        return;
    }

    // Create player list content
    const playerList = Object.keys(players)
        .map(initial => `${initial}`)
        .join(', ');

    showGenericPrompt({
        title: 'Select Player',
        message: 'Player initial',
        maxLength: 1,
        showPlayerList: true,
        playerListContent: 'Available players:\n' + playerList,
        validateInput: (value) => {
            const initial = value.trim().toUpperCase();
            if (initial.length !== 1) {
                return { isValid: false, message: 'Initial must be 1 letter' };
            }
            if (!players[initial]) {
                return { isValid: false, message: 'Please register first' };
            }
            return { isValid: true };
        },
        onConfirm: (value) => {
            const initial = value.trim().toUpperCase();

            // Update square via API
            fetch('/api/squares', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ row, col, value: initial })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateSquare(row, col, initial);
                } else {
                    showAlert('Failed to update square');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showAlert('Failed to update square');
            });
        }
    });
}

// Generic prompt method for input dialogs
function showGenericPrompt({
    title = 'Input Required',
    message = '',
    defaultValue = '',
    inputType = 'text',
    maxLength = null,
    minValue = null,
    maxValue = null,
    showPlayerList = false,
    playerListContent = '',
    validateInput = null,
    onConfirm = null,
    onCancel = null
}) {
    const genericPrompt = document.getElementById('genericPrompt');
    const promptTitle = document.getElementById('genericPromptTitle');
    const promptMessage = document.getElementById('genericPromptMessage');
    const promptInput = document.getElementById('genericPromptInput');
    const promptPlayerList = document.getElementById('genericPromptPlayerList');
    const okBtn = document.getElementById('genericPromptOkBtn');
    const cancelBtn = document.getElementById('genericPromptCancelBtn');

    // Set up prompt content
    promptTitle.textContent = title.toUpperCase();
    promptMessage.textContent = message.toUpperCase();
    promptInput.value = defaultValue;
    promptInput.type = inputType;
    
    if (maxLength !== null) promptInput.maxLength = maxLength;
    if (minValue !== null) promptInput.min = minValue;
    if (maxValue !== null) promptInput.max = maxValue;

    // Handle player list visibility
    promptPlayerList.style.display = showPlayerList ? 'block' : 'none';
    if (showPlayerList) {
        promptPlayerList.textContent = playerListContent;
    }

    // Show prompt
    genericPrompt.style.display = 'flex';
    promptInput.focus();

    // Input validation handler
    const handleValidation = (value) => {
        if (!validateInput) return { isValid: true };
        const result = validateInput(value);
        if (!result.isValid) {
            // Hide prompt temporarily
            genericPrompt.style.display = 'none';
            
            // Show error alert
            showAlert(result.message, 'Invalid Input', false, () => {
                // After alert is dismissed, show prompt again
                genericPrompt.style.display = 'flex';
                promptInput.value = '';
                promptInput.focus();
            });
        }
        return result;
    };

    // Input event handler
    promptInput.oninput = (e) => {
        const value = e.target.value;
        if (!value) return; // Allow empty for backspace
        handleValidation(value);
    };

    // Keyboard event handler
    promptInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            okBtn.click();
        } else if (e.key === 'Escape') {
            e.preventDefault();
            cancelBtn.click();
        }
    };

    // Button handlers
    okBtn.onclick = () => {
        const value = promptInput.value.trim();
        const validationResult = handleValidation(value);
        
        if (validationResult.isValid) {
            genericPrompt.style.display = 'none';
            promptInput.type = 'text'; // Reset input type
            promptPlayerList.style.display = 'block'; // Reset player list display
            if (onConfirm) onConfirm(value);
        }
    };

    cancelBtn.onclick = () => {
        genericPrompt.style.display = 'none';
        promptInput.type = 'text'; // Reset input type
        promptPlayerList.style.display = 'block'; // Reset player list display
        if (onCancel) onCancel();
    };
}

// Generic alert method for messages and confirmations
function showAlert(message, title = null, showCancel = false, callback = null) {
    const genericAlert = document.getElementById('genericAlert');
    const alertTitle = document.getElementById('genericAlertTitle');
    const alertMessage = document.getElementById('genericAlertMessage');
    const okBtn = document.getElementById('genericAlertOkBtn');
    const cancelBtn = document.getElementById('genericAlertCancelBtn');
    
    if (title === null) {
        // If only message is provided, use it as title and hide message
        alertTitle.textContent = message.toUpperCase();
        alertMessage.style.display = 'none';
    } else {
        // If both title and message are provided, show both
        alertTitle.textContent = title.toUpperCase();
        alertMessage.textContent = message.toUpperCase();
        alertMessage.style.display = 'block';
    }
    
    cancelBtn.style.display = showCancel ? 'inline-block' : 'none';
    genericAlert.style.display = 'flex';
    
    okBtn.onclick = () => {
        genericAlert.style.display = 'none';
        if (callback) callback(true);
    };
    
    cancelBtn.onclick = () => {
        genericAlert.style.display = 'none';
        if (callback) callback(false);
    };
}

function handleSquareDelete(row, col) {
    if (row === col) return; // Can't delete tie squares
    
    const currentValue = d3.select(`text[data-row='${row}'][data-col='${col}']`).text();
    if (!currentValue) return; // No need to confirm if square is empty
    
    const playerName = players[currentValue]?.name || 'Unknown Player';
    showAlert(
        `Player: ${currentValue} - ${playerName}`, 'Delete Square',
        true,
        (confirmed) => {
            if (confirmed) {
                fetch('/api/squares', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ row, col, value: '' })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        updateSquare(row, col, '');
                    } else {
                        showAlert("Failed to delete square");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    showAlert("Failed to delete square");
                });
            }
        }
    );
}

// Update square display function
function updateSquare(row, col, value) {
    const text = d3.select(`text[data-row='${row}'][data-col='${col}']`);
    if (text.empty()) return;

    // Convert value to uppercase before display
    const displayValue = value ? value.toUpperCase() : '';
    
    text.text(displayValue)
        .style("font-size", "12px")
        .style("fill", value ? (players[value.toUpperCase()]?.color || "#ffffff") : "#ffffff");
}

// Reset game function
function resetGame() {
    showAlert(
        'Erase all data?', null,
        true,
        (confirmed) => {
            if (confirmed) {
                fetch('/api/reset', {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        players = {};
                        updatePlayerList();
                        d3.selectAll('.square-text')
                            .filter(function() {
                                const row = d3.select(this).attr('data-row');
                                const col = d3.select(this).attr('data-col');
                                return row !== col;
                            })
                            .text('');
                        document.getElementById('teamLeft').value = '';
                        document.getElementById('teamRight').value = '';
                        updateTeamColors();
                        showAlert('Memory Cleared');
                    } else {
                        showAlert('Failed to reset game');
                    }
                })
                .catch(error => {
                    console.error('Error resetting game:', error);
                    showAlert('Failed to reset game');
                });
            }
        }
    );
}

document.addEventListener('DOMContentLoaded', () => {
    const newGameBtn = document.getElementById('newGameBtn');
    const loadGameBtn = document.getElementById('loadGameBtn');
    const landingOverlay = document.getElementById('landing-overlay');

    newGameBtn.addEventListener('click', () => {
        showAlert(
            'Confirm', 'New game?', 
            true,
            (confirmed) => {
                if (confirmed) {
                    fetch('/api/reset', {
                        method: 'POST'
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // Clear local players object
                            players = {};
                            // Update player list display
                            updatePlayerList();
                            // Clear all squares (except tie squares)
                            d3.selectAll('.square-text')
                                .filter(function() {
                                    const row = d3.select(this).attr('data-row');
                                    const col = d3.select(this).attr('data-col');
                                    return row !== col; // Don't clear tie squares
                                })
                                .text('');
                            // Reset team selections
                            document.getElementById('teamLeft').value = '';
                            document.getElementById('teamRight').value = '';

							// Create the grid
							createGrid();
							// Update team colors and visuals
							updateTeamColors();
							// Highlight current score square
							highlightCurrentScore();
                            // Hide landing overlay
                            landingOverlay.style.display = 'none';
                        } else {
                            showAlert('Failed to start new game');
                        }
                    })
                    .catch(error => {
                        console.error('Error starting new game:', error);
                        showAlert('Failed to start new game');
                    });
                }
            }
        );
    });

    loadGameBtn.addEventListener('click', () => {
        fetch('/api/state', {
            method: 'GET'
        })
        .then(response => response.json())
        .then(data => {
            if (data.squares && data.players && data.teams && data.scores) {
                // Load players
                players = data.players;
                updatePlayerList();
                
                // Set team dropdown values
                const teamLeft = document.getElementById('teamLeft');
                const teamRight = document.getElementById('teamRight');
                
                if (teamLeft && teamRight) {
                    teamLeft.value = data.teams.left || '';
                    teamRight.value = data.teams.right || '';
                }
                
                // Load scores
                currentLeftScore = data.scores.left;
                currentRightScore = data.scores.right;
                document.getElementById('leftScore').textContent = currentLeftScore;
                document.getElementById('rightScore').textContent = currentRightScore;
                
                // Create the grid
                createGrid();
                
                // Load squares
                d3.selectAll('.square-text')
                    .filter(function() {
                        const row = d3.select(this).attr('data-row');
                        const col = d3.select(this).attr('data-col');
                        return row !== col; // Don't clear tie squares
                    })
                    .text(function() {
                        const row = d3.select(this).attr('data-row');
                        const col = d3.select(this).attr('data-col');
                        return data.squares[row][col];
                    })
                    .style("fill", function() {
                        const row = d3.select(this).attr('data-row');
                        const col = d3.select(this).attr('data-col');
                        const value = data.squares[row][col];
                        return value ? (players[value]?.color || "#ffffff") : "#ffffff";
                    });
                
                // Update team colors and visuals
                updateTeamColors();
                // Highlight current score square
                highlightCurrentScore();
                // Hide landing overlay
                landingOverlay.style.display = 'none';
            } else {
                showAlert('Failed to load game state');
            }
        })
        .catch(error => {
            console.error('Error loading game state:', error);
            showAlert('Failed to load game state');
        });
    });
});
