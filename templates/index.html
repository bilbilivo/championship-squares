<!DOCTYPE html>
<html lang="en" class="{% if lite_mode %}lite-mode{% endif %}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CHAMPIONSHIP SQUARES</title>
    <script src="/static/d3.v7.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="landing-overlay" class="landing-overlay">
		<div class="landing-content">
			<h1 class="landing-title" id="gameTitleLanding">CHAMPIONSHIP SQUARES</h1>
			<div class="landing-buttons" id="mainButtons">
				<button id="newGameBtn" class="landing-btn">New Game</button>
				<button id="loadGameBtn" class="landing-btn">Load Game</button>
			</div>
			<div class="sport-selection" style="display: none;">
				<div class="sport-grid">
					<!-- <div class="sport-box" data-sport="fifa">FIFA</div> -->
                    <div class="sport-box" data-sport="mlb">MLB</div>
					<!-- <div class="sport-box" data-sport="nba">NBA</div> -->
					<div class="sport-box" data-sport="nfl">NFL</div>
					<div class="sport-box" data-sport="nhl">NHL</div>
					<div class="sport-box" data-sport="olym">OLYM</div>
				</div>
				<button id="backToMainBtn" class="landing-btn">Back</button>
			</div>
		</div>
	</div>
	<div id="genericAlert" class="alert-overlay" style="display: none;">
		<div class="alert-content">
			<h2 id="genericAlertTitle" class="alert-title">Alert</h2>
			<p id="genericAlertMessage" class="alert-message"></p>
			<div class="alert-buttons">
				<button id="genericAlertOkBtn" class="alert-btn">OK</button>
				<button id="genericAlertCancelBtn" class="alert-btn" style="display: none;">Cancel</button>
			</div>
		</div>
	</div>

	<div id="genericPrompt" class="alert-overlay" style="display: none;">
		<div class="alert-content">
			<h2 id="genericPromptTitle" class="alert-title">Input Required</h2>
			<p id="genericPromptMessage" class="alert-message"></p>
			<input type="text" id="genericPromptInput" class="prompt-input" />
			<div id="genericPromptPlayerList" class="player-list-prompt"></div>
			<div class="alert-buttons">
				<button id="genericPromptOkBtn" class="alert-btn">OK</button>
				<button id="genericPromptCancelBtn" class="alert-btn">Cancel</button>
			</div>
		</div>
	</div>
	<div class="container">
        <h1 class="title" id="gameTitle">CHAMPIONSHIP SQUARES</h1>
        <div class="controls">
			<div class="team-selector">
				<div class="team-selection">
					<img id="leftHelmet" class="helmet-icon" src="data:image/svg+xml," alt="Away Team">
					<select aria-label="Away team" id="teamLeft" onchange="updateTeamColors()">
						<option value="">SELECT AWAY TEAM</option>
					</select>
				</div>
				<button type="button" aria-label="Edit away score" id="leftScore" class="score scoreboard-digit" onclick="updateScore('left')">0</button>
				<div class="multiplier-selector">
					<div class="multiplier-label">MULTIPLIER</div>
					<div class="multiplier-buttons" id="multiplierButtons">
						<!-- Buttons will be dynamically generated based on sport -->
					</div>
				</div>
				<button type="button" aria-label="Edit home score" id="rightScore" class="score scoreboard-digit" onclick="updateScore('right')">0</button>
				<div class="team-selection">
					<select aria-label="Home team" id="teamRight" onchange="updateTeamColors()">
						<option value="">SELECT HOME TEAM</option>
					</select>
					<img id="rightHelmet" class="helmet-icon" src="data:image/svg+xml," alt="Home Team">
				</div>
			</div>
        </div>
        <div class="main-content">
			<section class="board-panel" aria-label="Score board">
                <div class="grid-container" id="grid">
				<div class="team-name-top"></div>
				<div class="team-name-left"></div>
				<div class="team-background left"></div>
				<div class="team-background right"></div>
			</div>
            </section>
            <aside class="legend-container">
                <div class="board-toolbar" role="group" aria-label="Board navigation">
                    <button class="reset-game-btn" onclick="goToScore()">Go to score</button>
                    <button class="reset-game-btn" onclick="zoomBoard(0.8)" aria-label="Zoom out">−</button>
                    <button class="reset-game-btn" onclick="zoomBoard(1.25)" aria-label="Zoom in">+</button>
                </div>
                <button class="players-toggle" aria-expanded="true" aria-controls="playersPanel" onclick="togglePlayers(this)">Players ▾</button>
                <div id="playersPanel" class="players-panel">
                <h2 style="text-align: center;">PLAYERS</h2>
                <div class="player-form">
					<div class="input-row">
						<input type="text"
							   aria-label="Player initial" id="playerInitial"
							   maxlength="1"
							   placeholder="ID"
							   pattern="[A-Za-z]"
							   style="text-transform: uppercase;"
							   oninput="this.value = this.value.toUpperCase()" />
						<input type="text"
							   aria-label="Player name" id="playerName"
							   maxlength="8"
							   placeholder="NAME"
							   style="text-transform: uppercase;"
							   oninput="this.value = this.value.toUpperCase()" />
					</div>
					<button onclick="addPlayer()">Add Player</button>
				</div>
                <div class="player-list" id="playerList"></div>
                </div>
				<div class="legend-controls">
                    <button onclick="resetGame()" class="reset-game-btn">Reset Game</button>
                    <button onclick="endGame()" class="end-game-btn">End Game</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="/static/js/board-geometry.js"></script>
    <script src="/static/js/game.js"></script>
</body>
</html>
