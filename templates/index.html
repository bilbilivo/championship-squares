<!DOCTYPE html>
<html data-public="{{ public_connection | tojson }}" lang="en" class="{% if lite_mode %}lite-mode{% endif %}">
<head>
    <meta charset="utf-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ asset_url('js/request-security.js') }}"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CHAMPIONSHIP SQUARES</title>
    <script src="/static/d3.v7.min.js"></script>
    <link rel="stylesheet" href="{{ asset_url('css/style.css') }}">
</head>
<body>
    <dialog id="playerModeDialog" class="join-game-dialog" aria-labelledby="playerModeTitle">
        <h2 id="playerModeTitle">PLAYER MODE</h2>
        <button type="button" id="switchToAdminBtn" hidden>CHANGE MODE</button>
        <form method="dialog"><button autofocus>BACK TO GAME</button></form>
    </dialog>
    <dialog id="joinGameDialog" class="join-game-dialog" aria-labelledby="joinGameTitle" aria-describedby="joinGameHelp">
        <h2 id="joinGameTitle">LOCAL GAME QR</h2>
        <p id="joinGameHelp">SAME NETWORK · SCAN TO PLAY</p>
        <p id="joinGameStatus" role="status">Loading QR code…</p>
        <img id="joinGameQr" class="join-game-qr" alt="Scan to open Championship Squares" hidden>
        <div id="tunnelControls" hidden>
            <p id="tunnelStatus">TUNNEL OFF</p>
            <button type="button" id="tunnelToggleBtn">ENABLE TUNNEL</button>
            <button type="button" id="registrationQrBtn" hidden>CREATE PLAYER QR</button>
            <div id="playerQrControls" hidden>
                <label id="playerQrLabel" for="playerQrSelect">PLAYER QR</label>
                <select id="playerQrSelect"></select>
                <button type="button" id="playerQrBtn">SHOW PLAYER QR</button>
                <button type="button" id="resetPlayerQrBtn">RESET PLAYER LINK</button>
            </div>
        </div>
        <form method="dialog"><button autofocus>CLOSE</button></form>
    </dialog>
    <div id="landing-overlay" class="landing-overlay">
		<div class="landing-content">
			<h1 class="landing-title" id="gameTitleLanding">CHAMPIONSHIP SQUARES</h1>
			<p id="publicJoinHelp" {% if not public_connection %}hidden{% endif %}>SCAN PLAYER QR</p>
            <div id="loginPanel" {% if public_connection %}hidden{% endif %}>
                <p>SELECT MODE</p>
                <div class="landing-buttons">
                    <button id="adminLoginBtn" class="landing-btn">ADMIN</button>
                    <button id="playerLoginBtn" class="landing-btn">PLAYER</button>
                </div>
                <div id="playerLoginPanel" hidden>
                    <form id="existingPlayerForm">
                        <label for="existingPlayer">SELECT PLAYER</label>
                        <select id="existingPlayer" required></select>
                        <button id="startPlayerBtn" class="landing-btn">JOIN</button>
                    </form>
                    <p>NEW</p>
                    <p id="teamSetupHelp" hidden>SELECT BOTH TEAMS IN ADMIN MODE FIRST.</p>
                    <form id="createPlayerForm">
                        <input id="loginInitial" aria-label="New player initial" placeholder="ID" maxlength="1" pattern="[A-Za-z]" required>
                        <input id="loginName" aria-label="New player name" placeholder="NAME" maxlength="8" required>
                        <button id="createPlayerBtn" class="landing-btn">CREATE</button>
                    </form>
                </div>
            </div>
            <p id="loginStatus" role="status"></p>
            <div class="landing-buttons" id="mainButtons" style="display: none;">
				<button id="newGameBtn" class="landing-btn">New Game</button>
				<button id="loadGameBtn" class="landing-btn">Load Game</button>
                <button id="landingLogoutBtn" class="landing-btn">Change mode</button>
			</div>
			<div class="sport-selection" style="display: none;">
				<div class="sport-grid">
					<!-- <div class="sport-box" data-sport="fifa">FIFA</div> -->
                    <div class="sport-box" data-sport="mlb">MLB</div>
					<!-- <div class="sport-box" data-sport="nba">NBA</div> -->
					<div class="sport-box" data-sport="nfl">NFL</div>
					<div class="sport-box" data-sport="nhl">NHL</div>
					<div class="sport-box" data-sport="olym">OLYM</div>
				</div>
				<button id="backToMainBtn" class="landing-btn">Back</button>
			</div>
		</div>
	</div>
	<div id="genericAlert" class="alert-overlay" style="display: none;">
		<div class="alert-content">
			<h2 id="genericAlertTitle" class="alert-title">Alert</h2>
			<p id="genericAlertMessage" class="alert-message"></p>
			<div class="alert-buttons">
				<button id="genericAlertOkBtn" class="alert-btn">OK</button>
				<button id="genericAlertCancelBtn" class="alert-btn" style="display: none;">Cancel</button>
			</div>
		</div>
	</div>

	<div id="genericPrompt" class="alert-overlay" style="display: none;">
		<div class="alert-content">
			<h2 id="genericPromptTitle" class="alert-title">Input Required</h2>
			<p id="genericPromptMessage" class="alert-message"></p>
			<input type="text" id="genericPromptInput" class="prompt-input" />
			<div id="genericPromptPlayerList" class="player-list-prompt"></div>
			<div class="alert-buttons">
				<button id="genericPromptOkBtn" class="alert-btn">OK</button>
				<button id="genericPromptCancelBtn" class="alert-btn">Cancel</button>
			</div>
		</div>
	</div>
	<div class="container">
        <header class="game-header">
        <div class="session-controls">
            <button type="button" id="logoutBtn" class="mode-btn" aria-label="Change mode" hidden>MODE</button>
            <span id="sessionLabel"></span>
        </div>
        <h1 class="title" id="gameTitle">CHAMPIONSHIP SQUARES</h1>
    <button type="button" id="joinGameBtn" class="join-game-btn" aria-label="Show QR code to join game" aria-haspopup="dialog" title="Scan to join">
        <svg viewBox="0 0 21 21" aria-hidden="true" shape-rendering="crispEdges">
            <path fill="currentColor" fill-rule="evenodd" d="M0 0h9v9H0z M2 2v5h5V2z M12 0h9v9h-9z M14 2v5h5V2z M0 12h9v9H0z M2 14v5h5v-5z"/>
            <path fill="currentColor" d="M3 3h3v3H3z M15 3h3v3h-3z M3 15h3v3H3z M12 12h3v3h-3z M18 12h3v6h-3z M12 18h3v3h-3z M15 15h3v3h-3z M18 19h3v2h-3z"/>
        </svg>
        <span>QR CODE</span>
    </button>
        </header>
        <div class="controls">
			<div class="team-selector">
				<div class="team-selection">
					<img id="leftHelmet" class="helmet-icon" src="data:image/svg+xml," alt="Away Team">
					<select aria-label="Away team" id="teamLeft" onchange="updateTeamColors()">
						<option value="">SELECT AWAY TEAM</option>
					</select>
				</div>
				<button type="button" aria-label="Edit away score" id="leftScore" class="score scoreboard-digit" onclick="updateScore('left')">0</button>
				<div class="multiplier-selector">
					<div class="multiplier-label">MULTIPLIER</div>
					<div class="multiplier-buttons" id="multiplierButtons">
						<!-- Buttons will be dynamically generated based on sport -->
					</div>
				</div>
				<button type="button" aria-label="Edit home score" id="rightScore" class="score scoreboard-digit" onclick="updateScore('right')">0</button>
				<div class="team-selection">
					<select aria-label="Home team" id="teamRight" onchange="updateTeamColors()">
						<option value="">SELECT HOME TEAM</option>
					</select>
					<img id="rightHelmet" class="helmet-icon" src="data:image/svg+xml," alt="Home Team">
				</div>
			</div>
        </div>
        <div class="main-content">
			<section class="board-panel" aria-label="Score board">
                <div class="grid-container" id="grid">
				<div class="team-name-top"></div>
				<div class="team-name-left"></div>
				<div class="team-background left"></div>
				<div class="team-background right"></div>
			</div>
            </section>
            <aside class="legend-container">
                <div class="board-toolbar" role="group" aria-label="Board navigation">
                    <button class="reset-game-btn" onclick="goToScore()">Go to score</button>
                    <button class="reset-game-btn" onclick="zoomBoard(0.8)" aria-label="Zoom out">−</button>
                    <button class="reset-game-btn" onclick="zoomBoard(1.25)" aria-label="Zoom in">+</button>
                </div>
                <button class="players-toggle" aria-expanded="true" aria-controls="playersPanel" onclick="togglePlayers(this)">Players ▾</button>
                <div id="playersPanel" class="players-panel">
                <h2 style="text-align: center;">PLAYERS</h2>
                <div class="player-form">
					<div class="input-row">
						<input type="text"
							   aria-label="Player initial" id="playerInitial"
							   maxlength="1"
							   placeholder="ID"
							   pattern="[A-Za-z]"
							   style="text-transform: uppercase;"
							   oninput="this.value = this.value.toUpperCase()" />
						<input type="text"
							   aria-label="Player name" id="playerName"
							   maxlength="8"
							   placeholder="NAME"
							   style="text-transform: uppercase;"
							   oninput="this.value = this.value.toUpperCase()" />
					</div>
					<button onclick="addPlayer()">Add Player</button>
				</div>
                <div class="player-list" id="playerList"></div>
                </div>
				<div class="legend-controls">
                    <button onclick="resetGame()" class="reset-game-btn">Reset Game</button>
                    <button onclick="endGame()" class="end-game-btn">End Game</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="{{ asset_url('js/board-geometry.js') }}"></script>
    <script src="{{ asset_url('js/board-text.js') }}"></script>
    <script src="{{ asset_url('js/game-sync.js') }}"></script>
    <script src="{{ asset_url('js/celebration-effects.js') }}"></script>
    <script src="{{ asset_url('js/login.js') }}"></script>
    <script src="{{ asset_url('js/game.js') }}"></script>
    <script src="{{ asset_url('js/join-game.js') }}"></script>
</body>
</html>
