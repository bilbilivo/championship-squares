<!DOCTYPE html>
<html>
<head>
    <title>Super Bowl Squares</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
/* Root Variables */
:root {
    --retro-green: #00ff00;
    --retro-dark: #002200;
    --retro-light: #88ff88;
    --pixel-border: 2px solid var(--retro-green);
    --grid-bg: #001100;
}

/* Base Styles */
body {
    font-family: 'Press Start 2P', monospace;
    background: var(--retro-dark);
    color: var(--retro-green);
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    box-sizing: border-box;
    text-shadow: 2px 2px var(--retro-dark);
}

/* Layout Structure */
.container {
    height: 100vh;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
    gap: 10px;
    padding: 10px;
    box-sizing: border-box;
    image-rendering: pixelated;
    overflow: hidden;
}

.title {
    text-align: center;
    color: var(--retro-green);
    font-size: 2em;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 2px;
    animation: blink 2s infinite;
}

.controls {
    text-align: center;
    border: var(--pixel-border);
    padding: 10px;
    background: var(--grid-bg);
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.main-content {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 20px;
    min-height: 0;
    height: calc(100vh - 200px);
}

/* Grid Container */
.grid-container {
    height: 100%;
    min-height: 600px;
    background: var(--grid-bg);
    border: var(--pixel-border);
    padding: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 4px 4px 0 var(--retro-green);
}

/* Legend Container */
.legend-container {
    height: 100%;
    background: var(--grid-bg);
    border: var(--pixel-border);
    padding: 20px;
    overflow-y: auto;
    box-shadow: 4px 4px 0 var(--retro-green);
}

/* Team Selection Styles */
.team-selector {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 15px;
    border: var(--pixel-border);
    background: var(--grid-bg);
    margin: 0;
}

.team-vs {
    color: var(--retro-green);
    font-size: 1.2em;
}

.team-selection {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* Helmet Icon */
.helmet-icon {
    width: 32px;
    height: 32px;
    image-rendering: pixelated;
}

/* Select Dropdowns */
select {
    background: var(--retro-dark);
    color: var(--retro-green);
    border: var(--pixel-border);
    padding: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    cursor: pointer;
}

select option {
    background: var(--retro-dark);
    color: var(--retro-green);
}

/* Button Styles */
button {
    background: var(--retro-green);
    color: var(--retro-dark);
    border: 2px solid var(--retro-light);
    padding: 10px 20px;
    margin: 0 10px;
    font-family: 'Press Start 2P', monospace;
    cursor: pointer;
    text-transform: uppercase;
    font-size: 12px;
    box-shadow: 2px 2px 0 var(--retro-dark);
}

button:hover {
    background: var(--retro-light);
    transform: translateY(-2px);
}

button:active {
    transform: translateY(2px);
    box-shadow: none;
}

/* Animations */
@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

.grid-container::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--retro-green);
    opacity: 0.1;
    animation: scanline 8s linear infinite;
    pointer-events: none;
}

@keyframes scanline {
    0% { transform: translateY(0); }
    100% { transform: translateY(100%); }
}

/* Grid Elements */
.square {
    stroke: var(--retro-green);
    stroke-width: 2;
    fill: var(--grid-bg);
    transition: fill 0.3s ease;
}

.square:hover {
    fill: var(--retro-light);
    cursor: pointer;
}

.square.tie-square {
    fill: #444444 !important;
    cursor: not-allowed !important;
}

.square.tie-square:hover {
    fill: #444444 !important;
}

/* Axis Styles */
.axis line,
.axis path {
    stroke: var(--retro-green);
    stroke-width: 1;
}

.axis text {
    fill: var(--retro-green);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
}

/* Team Names */
.team-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    fill: var(--retro-green);
    dominant-baseline: middle;
}

.team-name.vertical {
    text-anchor: end;
}

.team-name.horizontal {
    text-anchor: middle;
}

/* Square Text */
.square-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    fill: var(--retro-green);
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
}

/* Tooltip */
.tooltip {
    position: absolute;
    background: var(--retro-dark);
    border: 2px solid var(--retro-green);
    padding: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--retro-green);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 1000;
    box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
}

/* Player Management */
.player-form {
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: var(--pixel-border);
    padding: 10px;
    background: var(--grid-bg);
}

.player-form input {
    background: var(--retro-dark);
    border: var(--pixel-border);
    padding: 8px;
    color: var(--retro-green);
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
}

.player-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.player-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    background: var(--retro-dark);
    border: var(--pixel-border);
}

.color-dot {
    width: 16px;
    height: 16px;
    border: 2px solid var(--retro-green);
    flex-shrink: 0;
}

/* Delete Button */
.delete-btn {
    margin-left: auto;
    min-width: 24px;
    height: 24px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Scrollbar Styling */
::-webkit-scrollbar {
    width: 12px;
    height: 12px;
}

::-webkit-scrollbar-track {
    background: var(--retro-dark);
    border: var(--pixel-border);
}

::-webkit-scrollbar-thumb {
    background: var(--retro-green);
    border: 2px solid var(--retro-dark);
}

::-webkit-scrollbar-thumb:hover {
    background: var(--retro-light);
}

/* Media Queries for Responsiveness */
@media (max-width: 1200px) {
    .main-content {
        grid-template-columns: 1fr 250px;
    }
    
    .grid-container {
        min-height: 500px;
    }
}

@media (max-width: 768px) {
    .main-content {
        grid-template-columns: 1fr;
        height: auto;
    }
    
    .grid-container {
        min-height: 400px;
    }
    
    .legend-container {
        height: 300px;
    }
    
    .team-selector {
        flex-direction: column;
        padding: 10px;
    }
    
    .team-selection {
        width: 100%;
        justify-content: center;
    }
}

/* Team Name Background Highlights */
.team-name-background {
    fill: var(--retro-dark);
    opacity: 0.8;
}

/* Axis Label Positioning */
.axis-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    fill: var(--retro-green);
}

.axis-label.left {
    text-anchor: end;
}

.axis-label.right {
    text-anchor: start;
}

.header-square {
    cursor: default;
}

.header-text {
    pointer-events: none;
    font-family: 'Press Start 2P', monospace;
}

/* Adjust margins to account for score cells */
.grid-container {
    padding: 40px;  /* Increased padding to accommodate score cells */
}

/* Update team name positioning */
.team-name.vertical {
    transform: rotate(-90deg);
    transform-origin: left center;
}
    </style>
</head>

    <script>
	// Initialize variables
let zoomLevel = 1;
const baseSize = 40;
let currentSize = baseSize;
const maxScore = 60;
let players = {};

// Create SVG with modified margins for team names
const margin = { top: 60, right: 140, bottom: 60, left: 140 };
const gridContainer = document.querySelector('.grid-container');
const width = gridContainer.clientWidth;
const height = gridContainer.clientHeight;

// Generate 8-bit helmet SVG with both team colors
function generateHelmetSVG(primaryColor, secondaryColor) {
    // If no colors provided, use NFL colors
    primaryColor = primaryColor || '#013369';  // NFL Blue
    secondaryColor = secondaryColor || '#D50A0A';  // NFL Red

    return `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
            <!-- Main helmet shell -->
            <path d="M4 16 L8 8 L24 8 L28 16 L24 24 L8 24 Z" fill="${primaryColor}"/>
            <!-- Secondary color stripe -->
            <path d="M10 12 L22 12 L24 16 L22 20 L10 20 L8 16 Z" fill="${secondaryColor}"/>
            <!-- Facemask -->
            <path d="M12 14 L20 14 L21 16 L20 18 L12 18 L11 16 Z" fill="#444444"/>
        </svg>`;
}

// Create main SVG element
const svg = d3.select("#grid")
    .append("svg")
    .attr("width", "100%")
    .attr("height", "100%")
    .attr("viewBox", [-margin.left, -margin.top, 
        width + margin.left + margin.right, 
        height + margin.top + margin.bottom])
    .style("cursor", "grab");

// Create main group for zoomable content
const mainGroup = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

// Create separate groups for axes
const axesGroups = {
    top: svg.append("g").attr("class", "axis top"),
    bottom: svg.append("g").attr("class", "axis bottom"),
    left: svg.append("g").attr("class", "axis left"),
    right: svg.append("g").attr("class", "axis right")
};

// Create tooltip
const tooltip = d3.select("body")
    .append("div")
    .attr("class", "tooltip");

// Enhanced pan constraints
const getPanBounds = (transform) => {
    const gridWidth = (maxScore + 2) * currentSize;
    const gridHeight = (maxScore + 2) * currentSize;
    
    return {
        minX: Math.min(margin.left, width - gridWidth * transform.k - margin.right),
        maxX: margin.left,
        minY: Math.min(margin.top, height - gridHeight * transform.k - margin.bottom),
        maxY: margin.top
    };
};

function updateAxesPositions(transform) {
    Object.values(axesGroups).forEach(group => {
        group.attr("transform", `translate(${transform.x}, ${transform.y}) scale(${transform.k})`);
    });
}

// Zoom behavior
const zoom = d3.zoom()
    .scaleExtent([0.1, 4])
    .on("zoom", (event) => {
        const transform = event.transform;
        const bounds = getPanBounds(transform);
        
        const clampedX = Math.min(bounds.maxX, Math.max(bounds.minX, transform.x));
        const clampedY = Math.min(bounds.maxY, Math.max(bounds.minY, transform.y));
        
        const clampedTransform = d3.zoomIdentity
            .translate(clampedX, clampedY)
            .scale(transform.k);
        
        mainGroup.attr("transform", clampedTransform);
        updateAxesPositions(clampedTransform);
        zoomLevel = transform.k;
        
        // Update text sizes
        updateTextSizes(transform.k);
    });

svg.call(zoom);

// Update text sizes based on zoom level
function updateTextSizes(k) {
    d3.selectAll(".team-name, .header-text")
        .style("font-size", `${12 / k}px`);
}

// Create grid function
function createGrid() {
    // Clear existing elements
    mainGroup.selectAll("*").remove();
    Object.values(axesGroups).forEach(group => group.selectAll("*").remove());
    
    const squaresGroup = mainGroup.append("g");
    
    // Create scales for grid positioning
    const xScale = d3.scaleLinear()
        .domain([0, maxScore])
        .range([0, maxScore * currentSize]);
        
    const yScale = d3.scaleLinear()
        .domain([0, maxScore])
        .range([0, maxScore * currentSize]);

    // Create header cells for scores (0-9)
    // Top header (horizontal)
    for (let i = 0; i <= maxScore; i++) {
        squaresGroup.append("rect")
            .attr("class", "square header-square")
            .attr("x", i * currentSize)
            .attr("y", -currentSize)  // Position above main grid
            .attr("width", currentSize)
            .attr("height", currentSize)
            .attr("fill", "var(--grid-bg)")
            .attr("stroke", "var(--retro-green)");

        squaresGroup.append("text")
            .attr("class", "square-text header-text")
            .attr("x", i * currentSize + currentSize / 2)
            .attr("y", -currentSize / 2)
            .attr("text-anchor", "middle")
            .attr("dominant-baseline", "middle")
            .style("fill", "var(--retro-green)")
            .style("font-size", "12px")
            .text(i);
    }

    // Left header (vertical)
    for (let i = 0; i <= maxScore; i++) {
        squaresGroup.append("rect")
            .attr("class", "square header-square")
            .attr("x", -currentSize)  // Position left of main grid
            .attr("y", i * currentSize)
            .attr("width", currentSize)
            .attr("height", currentSize)
            .attr("fill", "var(--grid-bg)")
            .attr("stroke", "var(--retro-green)");

        squaresGroup.append("text")
            .attr("class", "square-text header-text")
            .attr("x", -currentSize / 2)
            .attr("y", i * currentSize + currentSize / 2)
            .attr("text-anchor", "middle")
            .attr("dominant-baseline", "middle")
            .style("fill", "var(--retro-green)")
            .style("font-size", "12px")
            .text(i);
    }

    // Create main grid squares
    for (let row = 0; row <= maxScore; row++) {
        for (let col = 0; col <= maxScore; col++) {
            const isTieSquare = row === col;
            
            // Create square
            squaresGroup.append("rect")
                .attr("class", `square ${isTieSquare ? 'tie-square' : ''}`)
                .attr("x", col * currentSize)
                .attr("y", row * currentSize)
                .attr("width", currentSize)
                .attr("height", currentSize)
                .on("click", () => !isTieSquare && handleSquareClick(row, col))
                .on("contextmenu", (event) => {
                    event.preventDefault();
                    if (!isTieSquare) handleSquareDelete(row, col);
                })
                .on("mouseover", (event) => {
                    if (!isTieSquare) {
                        const leftTeam = document.getElementById('teamLeft').value;
                        const rightTeam = document.getElementById('teamRight').value;
                        tooltip.style("opacity", 1)
                            .html(`${leftTeam}: ${row}<br>${rightTeam}: ${col}`)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 10) + "px");
                    }
                })
                .on("mouseout", () => {
                    tooltip.style("opacity", 0);
                });

            // Add text for squares
            squaresGroup.append("text")
                .attr("class", `square-text ${isTieSquare ? 'tie-text' : ''}`)
                .attr("x", col * currentSize + currentSize / 2)
                .attr("y", row * currentSize + currentSize / 2)
                .attr("data-row", row)
                .attr("data-col", col)
                .style("font-size", "12px")
                .style("fill", "#ffffff")
                .text(isTieSquare ? row : '');
        }
    }

    // Update team names with adjusted positioning
    const teamNameOffset = currentSize * 1.5; // Increased offset to account for score cells
    updateTeamNames(teamNameOffset);
}

const NFL_TEAMS = {
    "ARI": { name: "Arizona Cardinals", colors: ["#97233F", "#000000"] },
    "ATL": { name: "Atlanta Falcons", colors: ["#A71930", "#000000"] },
    "BAL": { name: "Baltimore Ravens", colors: ["#241773", "#000000"] },
    "BUF": { name: "Buffalo Bills", colors: ["#00338D", "#C60C30"] },

function addPlayer() {
    const initialInput = document.getElementById('playerInitial');
    const nameInput = document.getElementById('playerName');
    const initial = initialInput.value.toUpperCase();
    const name = nameInput.value.trim();

    // Validate initial
    if (initial.length !== 1) {
        alert("Initial must be exactly 1 letter.");
        return;
    }

    // Validate name length and content
    if (!name) {
        alert("Please enter a name.");
        return;
    }
    
    if (name.length > 8) {
        alert("Name must be 8 characters or less.");
        nameInput.value = name.substring(0, 8); // Trim to 8 characters
        return;
    }

    // Check for duplicate initial
    if (players[initial]) {
        alert(`Initial '${initial}' is already taken by ${players[initial].name}`);
        return;
    }

    // Add player via API
    fetch('/api/players', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initial, name })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            players[initial] = { name, color: data.color };
            updatePlayerList();
            // Clear inputs after successful addition
            initialInput.value = '';
            nameInput.value = '';
        } else {
            alert(data.error || "Failed to add player.");
        }
    })
    .catch(error => {
        console.error("Error adding player:", error);
        alert("Failed to add player. Please try again.");
    });
}

// Player management functions
function updatePlayerList() {
    const playerList = document.getElementById('playerList');
    playerList.innerHTML = '';
    
    Object.entries(players).forEach(([initial, info]) => {
        const playerItem = document.createElement('div');
        playerItem.className = 'player-item';
        
        const colorDot = document.createElement('div');
        colorDot.className = 'color-dot';
        colorDot.style.backgroundColor = info.color;
        
        const playerInfo = document.createElement('div');
        playerInfo.className = 'player-info';
        playerInfo.style.fontSize = '12px';
        playerInfo.style.whiteSpace = 'nowrap';
        playerInfo.style.overflow = 'hidden';
        playerInfo.style.textOverflow = 'ellipsis';
        playerInfo.style.maxWidth = '150px';  // Adjust based on your layout
        playerInfo.textContent = `${initial} - ${info.name}`;
        
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = 'X';  // Shorter text
        deleteBtn.style.fontSize = '10px';
        deleteBtn.style.padding = '4px 8px';
        deleteBtn.onclick = () => deletePlayer(initial);
        
        playerItem.appendChild(colorDot);
        playerItem.appendChild(playerInfo);
        playerItem.appendChild(deleteBtn);
        playerList.appendChild(playerItem);
    });
}

function deletePlayer(initial) {
    // First confirm deletion
    if (!confirm(`Are you sure you want to delete player ${initial} - ${players[initial].name}?`)) {
        return;
    }

    // Delete player via API
    fetch(`/api/players/${initial}`, {
        method: 'DELETE',
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Remove from local players object
            delete players[initial];
            // Update the player list display
            updatePlayerList();
            // Clear any squares with this player's initial
            d3.selectAll('.square-text')
                .filter(function() {
                    return d3.select(this).text() === initial;
                })
                .each(function() {
                    const row = d3.select(this).attr('data-row');
                    const col = d3.select(this).attr('data-col');
                    updateSquare(row, col, '');
                });
        } else {
            alert(data.error || "Failed to delete player");
        }
    })
    .catch(error => {
        console.error("Error deleting player:", error);
        alert("Failed to delete player. Please try again.");
    });
}

// Square interaction handlers
function handleSquareClick(row, col) {
    if (row === col) return; // Prevent tie square interaction
    
    // Create list of available players
    let playerList = Object.keys(players).map(initial => `${initial} - ${players[initial].name}`).join('\n');
    const value = prompt(`Enter player initial (1 letter):\n\nAvailable players:\n${playerList}`);
    if (!value) return;
    
    const initial = value.toUpperCase();
    
    if (initial.length !== 1) {
        alert("Initial must be exactly 1 letter.");
        return;
    }
    
    if (!players[initial]) {
        alert("Please register your initial in the legend first.");
        return;
    }
    
    // Update square via API
    fetch('/api/squares', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ row, col, value: initial })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            updateSquare(row, col, initial);
        } else {
            alert("Failed to update square.");
        }
    })
    .catch(error => {
        console.error("Error:", error);
        alert("Failed to update square.");
    });
}

function handleSquareDelete(row, col) {
    if (row === col) return; // Can't delete tie squares
    
    const currentValue = d3.select(`text[data-row='${row}'][data-col='${col}']`).text();
    if (!currentValue) return; // No need to confirm if square is empty
    
    const playerName = players[currentValue]?.name || 'Unknown Player';
    if (confirm(`Are you sure you want to delete this square?\nPlayer: ${currentValue} - ${playerName}`)) {
        // Update square via API
        fetch('/api/squares', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ row, col, value: '' })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                updateSquare(row, col, '');
            } else {
                alert("Failed to delete square.");
            }
        })
        .catch(error => {
            console.error("Error:", error);
            alert("Failed to delete square.");
        });
    }
}

function updateSquare(row, col, value) {
    const text = d3.select(`text[data-row='${row}'][data-col='${col}']`);
    if (text.empty()) return;

    text.text(value)
        .style("font-size", "12px")
        .style("fill", value ? (players[value]?.color || "#ffffff") : "#ffffff");
}
