<!DOCTYPE html>
<html class="{% if lite_mode %}lite-mode{% endif %}">
<head>
    <title>CHAMPIONSHIP SQUARES</title>
    <script src="/static/d3.v7.min.js"></script>
    <style>
/* Local font */
@font-face {
    font-family: 'Press Start 2P';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/static/fonts/PressStart2P-Regular.woff2') format('woff2');
}

/* Root Variables */
/* Sport-Specific Color Schemes */
:root {
    /* NFL Theme (Blue) */
    --nfl-primary: #007FFF;  /* Main NFL blue */
    --nfl-dark: #051333;     /* Darker shade for backgrounds */
    --nfl-light: #2B5BBA;    /* Lighter blue for highlights */
    --nfl-bg: #030A1F;       /* Very dark blue for background */
    --nfl-logo-primary: #003087;    /* Dark Royal Blue */
    --nfl-logo-secondary: #DB1F26;  /* Bright Red */

    /* NHL Theme (Orange) */
    --nhl-primary: #F78F1E;  /* Main NHL orange */
    --nhl-dark: #331C04;     /* Darker shade for backgrounds */
    --nhl-light: #FFB05C;    /* Lighter orange for highlights */
    --nhl-bg: #1F1103;       /* Very dark orange-tinted for background */
	--nhl-logo-primary: #FF4C00;    /* Orange */
    --nhl-logo-secondary: #FFFFFF;  /* White */

    /* NBA Theme (Red) */
    --nba-primary: #ff0000;
    --nba-dark: #220000;
    --nba-light: #ff8888;
    --nba-bg: #110000;
    --nba-logo-primary: #EC003D;    /* Bright Red */
    --nba-logo-secondary: #1D428A;  /* Royal Blue */
	
    /* MLB Theme (Green) */
    --mlb-primary: #00ff00;
    --mlb-dark: #002200;
    --mlb-light: #88ff88;
    --mlb-bg: #001100;
    --mlb-logo-primary: #002D72;    /* Navy Blue */
    --mlb-logo-secondary: #D50032;  /* Red */

    /* Olympics Theme (Gold) */
    --olym-primary: #FFD700;  /* Olympic Gold */
    --olym-dark: #332B00;     /* Dark gold for backgrounds */
    --olym-light: #FFE55C;    /* Lighter gold for highlights */
    --olym-bg: #1A1500;       /* Very dark gold-tinted for background */
    --olym-logo-primary: #FFD700;    /* Gold */
    --olym-logo-secondary: #0085C7;  /* Olympic Blue */

    /* FIFA World Cup Theme (Green/Gold) - High Contrast */
    --fifa-primary: #00A651;   /* Bright FIFA Green */
    --fifa-dark: #0D3D1F;      /* Dark green for backgrounds */
    --fifa-light: #5FD068;     /* Bright green for highlights */
    --fifa-bg: #061A0D;        /* Very dark green for background */
    --fifa-logo-primary: #00A651;     /* Bright FIFA Green */
    --fifa-logo-secondary: #FFD700;   /* Bright Gold */

    /* Active Theme (set programmatically based on sport) */
    --retro-primary: var(--nfl-primary);
    --retro-dark: var(--nfl-dark);
    --retro-light: var(--nfl-light);
    --retro-bg: var(--nfl-bg);
    --retro-logo-primary: var(--nfl-logo-primary);
    --retro-logo-secondary: var(--nfl-logo-secondary);


	--pixel-border: 2px solid var(--retro-primary);
}

/* ==========================================
   LITE MODE - Reduced visual effects
   Disables animations, transitions, glows,
   confetti, fireworks, and scanlines
   while preserving all gameplay functionality
   ========================================== */

/* Disable all animations in lite mode */
.lite-mode *,
.lite-mode *::before,
.lite-mode *::after {
    animation: none !important;
    transition: none !important;
}

/* Remove scanline effect */
.lite-mode .grid-container::after {
    display: none !important;
}

/* Remove glow effects from buttons */
.lite-mode .multiplier-btn.active {
    box-shadow: none !important;
}

/* Remove winner glow effects */
.lite-mode .square.winner-square {
    filter: none !important;
}

.lite-mode .square.winner-path {
    fill: rgba(255, 215, 0, 0.3) !important;
    stroke: rgba(255, 215, 0, 0.6) !important;
}

/* Simplified celebration overlay */
.lite-mode .celebration-overlay {
    animation: none !important;
}

.lite-mode .celebration-trophy {
    animation: none !important;
    filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)) !important;
}

.lite-mode .celebration-winner-banner .winner-name {
    animation: none !important;
    text-shadow: 2px 2px 0 #8B4513, 0 0 20px #FFD700 !important;
}

/* Loading dots animation for all modes */
.loading-dots {
    display: flex !important;
    gap: 12px;
    justify-content: center;
    align-items: center;
    margin: 20px auto;
    min-height: 20px;
    visibility: visible !important;
    opacity: 1 !important;
}

.loading-dots span {
    display: inline-block;
    width: 12px;
    height: 12px;
    min-width: 12px;
    min-height: 12px;
    background: var(--retro-primary, #007FFF);
    opacity: 1;
    visibility: visible;
    animation: dot-blink 1.2s ease-in-out infinite;
}

.loading-dots span:nth-child(2) {
    animation-delay: 0.4s;
}

.loading-dots span:nth-child(3) {
    animation-delay: 0.8s;
}

@keyframes dot-blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.8); }
}

/* Lite mode - override animation: none to allow loading dots */
.lite-mode .loading-dots span {
    animation-name: dot-blink !important;
    animation-duration: 1.2s !important;
    animation-timing-function: ease-in-out !important;
    animation-iteration-count: infinite !important;
}

.lite-mode .loading-dots span:nth-child(2) {
    animation-delay: 0.4s !important;
}

.lite-mode .loading-dots span:nth-child(3) {
    animation-delay: 0.8s !important;
}

.lite-mode .celebration-winner-name {
    animation: none !important;
    text-shadow: 2px 2px 0 #8B4513 !important;
}

.lite-mode .podium-entry.winner {
    animation: none !important;
    box-shadow: 0 0 15px #FFD700 !important;
}

/* Hide animated confetti and fireworks in lite mode */
.lite-mode .celebration-confetti,
.lite-mode .celebration-fireworks,
.lite-mode .firework,
.lite-mode .firework-particle {
    display: none !important;
}

/* ---- LITE MODE: Static 8-bit decorations ---- */

/* Static pixel confetti pieces */
.lite-mode .static-confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    image-rendering: pixelated;
}

/* Static pixel firework bursts */
.lite-mode .static-firework {
    position: absolute;
    image-rendering: pixelated;
}

.lite-mode .static-firework-center {
    width: 8px;
    height: 8px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.lite-mode .static-firework-ray {
    position: absolute;
    width: 4px;
    height: 4px;
}

/* Static decorations container */
.lite-mode .static-decorations {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

/* Remove button hover transforms */
.lite-mode button:hover {
    transform: none !important;
}

.lite-mode .celebration-btn:hover {
    transform: none !important;
}

/* Remove title blink */
.lite-mode .title {
    animation: none !important;
    opacity: 1 !important;
}

/* Remove landing content glow */
.lite-mode .landing-content {
    animation: none !important;
    box-shadow: none !important;
}

.lite-mode .landing-title {
    animation: none !important;
    opacity: 1 !important;
}

/* Remove tooltip transition */
.lite-mode .tooltip {
    transition: none !important;
}

/* Remove square fill transition */
.lite-mode .square {
    transition: none !important;
}

/* ========================================== */


/* Base Styles */
body {
    font-family: 'Press Start 2P', monospace;
    background: var(--retro-dark);
    color: var(--retro-primary);
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    box-sizing: border-box;
    text-shadow: 2px 2px var(--retro-dark);
}

/* Layout Structure */
.container {
    height: 100vh;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
    gap: 5px;
    padding: 5px 10px;
    box-sizing: border-box;
    image-rendering: pixelated;
    overflow: hidden;
}

.title {
    text-align: center;
    color: var(--retro-primary);
    font-size: 2em;
    margin: 0;
    padding: 0;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 2px;
    animation: blink 2s infinite;
}

.controls {
    text-align: center;
    border: var(--pixel-border);
    padding: 5px 10px;
    background: var(--retro-bg);
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.main-content {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 20px;
    min-height: 0;
    height: calc(100vh - 200px);
}

/* Grid Container */
.grid-container {
    height: 100%;
    min-height: 600px;
    background: var(--retro-bg);
    border: var(--pixel-border);
    padding: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 4px 4px 0 var(--retro-primary);
    flex-grow: 1;
}

/* Legend Container */
.legend-container {
    height: 100%;
    background: var(--retro-bg);
    border: var(--pixel-border);
    padding: 20px;
    overflow-y: auto;
    box-shadow: 4px 4px 0 var(--retro-primary);
}

/* Team Selection Styles */
.team-selector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    padding: 8px 15px;
    border: var(--pixel-border);
    background: var(--retro-bg);
    margin: 0;
}

.team-vs {
    color: var(--retro-primary);
    font-size: 1.2em;
}

.multiplier-selector {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.multiplier-label {
    color: var(--retro-primary);
    font-size: 0.8em;
    font-weight: bold;
}

.multiplier-buttons {
    display: flex;
    gap: 5px;
}

.multiplier-btn {
    background: var(--retro-dark);
    color: var(--retro-primary);
    border: 2px solid var(--retro-primary);
    padding: 6px 10px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 50px;
}

.multiplier-btn:hover {
    background: var(--retro-primary);
    color: var(--retro-dark);
}

.multiplier-btn.active {
    background: var(--retro-primary);
    color: var(--retro-dark);
    box-shadow: 0 0 10px var(--retro-primary);
}

.multiplier-value {
    font-size: 1.1em;
    line-height: 1;
}

.multiplier-hint {
    font-size: 0.7em;
    opacity: 0.8;
    line-height: 1;
}

.tokens-display {
    color: var(--retro-primary);
    font-size: 0.9em;
    font-weight: bold;
    margin-top: 5px;
}

.team-selection {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* Helmet Icon */
.helmet-icon {
    width: 64px;
    height: 64px;
    image-rendering: pixelated;
}

/* Select Dropdowns */
select {
    background: var(--retro-dark);
    color: var(--retro-primary);
    border: var(--pixel-border);
    padding: 6px;
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    cursor: pointer;
    min-width: 200px;
}

select option {
    background: var(--retro-dark);
    color: var(--retro-primary);
    font-size: 20px;
    padding: 6px;
}

/* Button Styles */
button {
    background: var(--retro-primary);
    color: var(--retro-dark);
    border: 2px solid var(--retro-light);
    padding: 10px 20px;
    margin: 0 10px;
    font-family: 'Press Start 2P', monospace;
    cursor: pointer;
    text-transform: uppercase;
    font-size: 12px;
    box-shadow: 2px 2px 0 var(--retro-dark);
}

button:hover {
    background: var(--retro-light);
    transform: translateY(-2px);
}

button:active {
    transform: translateY(2px);
    box-shadow: none;
}

/* Animations */
@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

.grid-container::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--retro-primary);
    opacity: 0.1;
    animation: scanline 8s linear infinite;
    pointer-events: none;
}

@keyframes scanline {
    0% { transform: translateY(0); }
    100% { transform: translateY(100%); }
}

/* Grid Elements */
.square {
    stroke: var(--retro-primary);
    stroke-width: 2;
    fill: var(--retro-bg);
    transition: fill 0.3s ease;
}

.square:hover {
    fill: var(--retro-light);
    cursor: pointer;
}

.square.tie-square,
.square.header-square {
    fill: var(--retro-bg) !important;
    cursor: not-allowed !important;
}

.square.tie-square:hover,
.square.header-square:hover {
    fill: var(--retro-bg) !important;
}

/* Winner Path Styles */
.square.winner-path {
    fill: rgba(255, 215, 0, 0.3) !important;
    stroke: rgba(255, 215, 0, 0.6) !important;
    stroke-width: 3 !important;
}

.square.winner-square {
    fill: rgba(255, 215, 0, 0.4) !important;
    stroke: gold !important;
    stroke-width: 5 !important;
    filter: drop-shadow(0 0 10px gold);
}

/* Winner Celebration Overlay */
.celebration-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    animation: celebrationFadeIn 0.5s ease-out;
}

@keyframes celebrationFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.celebration-trophy {
    margin-bottom: 20px;
    animation: trophyBounceGlow 0.6s ease-in-out infinite alternate;
}

.celebration-trophy img {
    height: 200px;
    width: auto;
}

@keyframes trophyBounceGlow {
    0% {
        transform: scale(1) translateY(0);
        filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)) drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    }
    100% {
        transform: scale(1.08) translateY(-8px);
        filter: drop-shadow(0 0 25px rgba(255, 223, 0, 1)) drop-shadow(0 0 40px rgba(255, 180, 0, 0.6)) drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    }
}

.celebration-winner-banner {
    text-align: center;
    margin-bottom: 10px;
}

.celebration-winner-banner .winner-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 36px;
    color: #fff;
    text-shadow: 3px 3px 0 #000;
    margin-bottom: 10px;
}

.celebration-winner-banner .winner-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 48px;
    color: #FFD700;
    text-shadow: 4px 4px 0 #8B4513, 0 0 30px #FFD700;
    animation: winnerGlow 0.6s ease-in-out infinite alternate;
}

.celebration-final-score {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    font-family: 'Press Start 2P', monospace;
    margin-bottom: 20px;
}

.final-score-team {
    font-size: 18px;
    color: #fff;
    text-shadow: 2px 2px 0 #000;
}

.final-score-value {
    font-size: 32px;
    color: #FFD700;
    text-shadow: 2px 2px 0 #8B4513;
}

.final-score-separator {
    font-size: 24px;
    color: #fff;
}

.celebration-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    color: #fff;
    text-shadow: 2px 2px 0 #000;
    margin-bottom: 10px;
}

@keyframes titlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

.celebration-winners {
    font-family: 'Press Start 2P', monospace;
    font-size: 24px;
    color: #fff;
    text-align: center;
    margin-bottom: 40px;
    line-height: 2;
}

.celebration-winner-name {
    display: block;
    color: #FFD700;
    text-shadow: 2px 2px 0 #8B4513, 0 0 10px #FFD700, 0 0 20px #FFA500;
    animation: winnerGlow 0.6s ease-in-out infinite alternate;
}

@keyframes winnerGlow {
    from { text-shadow: 2px 2px 0 #8B4513, 0 0 10px #FFD700, 0 0 20px #FFA500; }
    to { text-shadow: 2px 2px 0 #8B4513, 0 0 20px #FFD700, 0 0 40px #FFA500; }
}

/* Podium/Standings styles */
.celebration-podium {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 20px 0;
    width: 700px;
    max-width: 700px;
}

.podium-entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 8px 16px;
    margin: 4px 0;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    background: rgba(0, 0, 0, 0.5);
    border: 2px solid;
    border-radius: 4px;
}

.podium-entry.winner {
    font-size: 20px;
    padding: 16px 20px;
    background: rgba(255, 215, 0, 0.3);
    border-color: #FFD700;
    animation: winnerPulse 0.6s ease-in-out infinite alternate;
}

@keyframes winnerPulse {
    from { box-shadow: 0 0 10px #FFD700; }
    to { box-shadow: 0 0 25px #FFD700; }
}

.podium-entry.other {
    border-color: rgba(255, 255, 255, 0.3);
    opacity: 0.8;
}

.podium-rank {
    color: #888;
    width: 24px;
    min-width: 24px;
    flex-shrink: 0;
}

.podium-entry.winner .podium-rank {
    color: #FFD700;
}

.podium-name {
    width: 140px;
    min-width: 140px;
    text-align: left;
    margin-left: 15px;
    color: #fff;
    flex-shrink: 0;
}

.podium-entry.winner .podium-name {
    color: #FFD700;
}

.podium-score {
    color: #ccc;
    font-size: 14px;
    width: 200px;
    min-width: 200px;
    margin-left: 15px;
    white-space: nowrap;
    flex-shrink: 0;
    text-align: center;
}

.podium-entry.winner .podium-score {
    color: #FFD700;
}

.podium-distance {
    color: #aaa;
    font-size: 14px;
    width: 140px;
    min-width: 140px;
    margin-left: 15px;
    text-align: center;
    flex-shrink: 0;
}

.podium-entry.winner .podium-distance {
    color: #FFD700;
}

.podium-multiplier {
    color: #aaa;
    font-size: 14px;
    width: 50px;
    min-width: 50px;
    text-align: center;
    margin-left: 15px;
    flex-shrink: 0;
}

.podium-entry.winner .podium-multiplier {
    color: #FFD700;
}

/* Celebration action buttons */
.celebration-actions {
    display: flex;
    gap: 20px;
    margin-top: 30px;
}

.celebration-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    padding: 15px 30px;
    cursor: pointer;
    border: 3px solid;
    transition: all 0.2s;
}

.celebration-btn.reset-btn {
    background: var(--retro-primary);
    color: var(--retro-bg);
    border-color: var(--retro-primary);
}

.celebration-btn.reset-btn:hover {
    background: var(--retro-light);
    color: var(--retro-dark);
    transform: translateY(-2px);
}

.celebration-btn.cancel-btn {
    background: transparent;
    color: #fff;
    border-color: #fff;
}

.celebration-btn.cancel-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
}

.celebration-confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    animation: confettiFall linear forwards;
}

@keyframes confettiFall {
    0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* Fireworks */
.celebration-fireworks {
    position: absolute;
    top: 0;
    width: 20%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
}

.celebration-fireworks.fireworks-left {
    left: 0;
}

.celebration-fireworks.fireworks-right {
    right: 0;
}

.celebration-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 50;
}

.firework {
    position: absolute;
    width: 8px;
    height: 8px;
}

.firework-particle {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    animation: fireworkBurst 1.5s ease-out forwards;
}

.firework-particle.large {
    width: 21px;
    height: 21px;
}

@keyframes fireworkBurst {
    0% {
        transform: rotate(var(--angle)) translateX(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: rotate(var(--angle)) translateX(156px) scale(0);
        opacity: 0;
    }
}

/* End Game Button */
.end-game-btn {
    background: linear-gradient(180deg, #FFD700 0%, #FFA500 100%);
    color: #000;
    border: 3px solid #8B4513;
}

.end-game-btn:hover {
    background: linear-gradient(180deg, #FFA500 0%, #FF8C00 100%);
}

/* Axis Styles */
.axis line,
.axis path {
    stroke: var(--retro-primary);
    stroke-width: 1;
}

.axis text {
    fill: var(--retro-primary);
    font-family: 'Press Start 2P', monospace;
    font-size: 12px !important;
}


/* Square Text */
.square-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 18px !important;
    fill: var(--retro-primary);
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
}

/* Tooltip */
.tooltip {
    position: absolute;
    background: var(--retro-dark);
    border: 2px solid var(--retro-primary);
    padding: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--retro-primary);
    pointer-events: none;
    opacity: 0;

let zoomLevel = 1;
const baseSize = 40;
let currentSize = baseSize;
// Update maxScore variable to be dynamic

// Lite mode - detected from html class set by server
const isLiteMode = document.documentElement.classList.contains('lite-mode');
let players = {};  // Format: {'A': {'name': 'Alice', 'playerIndex': 0, 'bets': 0, 'tokens': 40}
let currentSport = 'nfl';  // Default sport
let currentMultiplier = 1;  // Current betting multiplier
let availableMultipliers = [1, 2, 4, 8];  // Available multipliers for current sport
let multiplierLabels = ['<Q1', '<Q2', '<Q3', '<Q4'];  // Labels for when to use each multiplier
let tokensPerPlayer = 40;  // Tokens each player gets for current sport

// Create SVG with modified margins for team names
const margin = { top: 60, right: 140, bottom: 60, left: 140 };
const gridContainer = document.querySelector('.grid-container');
const width = gridContainer.clientWidth;
const height = gridContainer.clientHeight;

// Get color from index using d3's color scale
const playerColorScale = d3.scaleOrdinal(d3.schemeCategory10);
// const playerColorScale = d3.scaleOrdinal(d3.schemeObservable10);
// const playerColorScale = d3.scaleOrdinal(d3.schemeTableau10);
// const playerColorScale = d3.scaleOrdinal(d3.schemePaired);

// Modify the setSportTheme function to have an option to skip the API call
function setSportTheme(sport, skipAPICall = false) {
    const root = document.documentElement;
    currentSport = sport.toLowerCase();
    
    // Update game title
    updateGameTitle(currentSport);
    
    root.style.setProperty('--retro-primary', `var(--${sport}-primary)`);
    root.style.setProperty('--retro-dark', `var(--${sport}-dark)`);
    root.style.setProperty('--retro-light', `var(--${sport}-light)`);
    root.style.setProperty('--retro-bg', `var(--${sport}-bg)`);
    root.style.setProperty('--retro-logo-primary', `var(--${sport}-logo-primary)`);
    root.style.setProperty('--retro-logo-secondary', `var(--${sport}-logo-secondary)`);

    // Only make the API call if not skipped
    if (!skipAPICall) {
        fetch('/api/sport', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sport: currentSport })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                maxScore = data.max_score;
                availableMultipliers = data.available_multipliers || [1];
                multiplierLabels = data.multiplier_labels || [];
                tokensPerPlayer = data.tokens_per_player || 40;
                currentMultiplier = 1;
                updateMultiplierButtons();
                createGrid(); // Recreate grid with new max score
            }
        })
        .catch(error => console.error('Error updating sport:', error));
    }
    
    // Update team selections
    populateTeamSelects();
}

// Function to select a multiplier
function selectMultiplier(multiplier) {
    currentMultiplier = multiplier;

    // Update button states - remove active from all, then add to the selected one
    const buttons = document.querySelectorAll('.multiplier-btn');
    buttons.forEach((btn, index) => {
        btn.classList.remove('active');
        // Add active class to the button with the matching multiplier
        if (availableMultipliers[index] === multiplier) {
            btn.classList.add('active');
        }
    });

    // Save multiplier to backend
    fetch('/api/multiplier', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ multiplier: multiplier })
    })
    .then(response => response.json())
    .then(data => {
        if (!data.success) {
            console.error('Failed to update multiplier:', data.error);
        }
    })
    .catch(error => console.error('Error updating multiplier:', error));
}

// Enhanced pan constraints
const getPanBounds = (transform) => {
    const gridWidth = (maxScore + 2) * currentSize;
    const gridHeight = (maxScore + 2) * currentSize;
    
    return {
        minX: Math.min(margin.left, width - gridWidth * transform.k - margin.right),
        maxX: margin.left,
        minY: Math.min(margin.top, height - gridHeight * transform.k - margin.bottom),
        maxY: margin.top
    };
};

function updateAxesPositions(transform) {
    Object.values(axesGroups).forEach(group => {
        group.attr("transform", `translate(${transform.x}, ${transform.y}) scale(${transform.k})`);
    });
}

// Zoom behavior
const zoom = d3.zoom()
    .scaleExtent([0.1, 4])
    .on("zoom", (event) => {
        const transform = event.transform;
        const bounds = getPanBounds(transform);
        
        const clampedX = Math.min(bounds.maxX, Math.max(bounds.minX, transform.x));
        const clampedY = Math.min(bounds.maxY, Math.max(bounds.minY, transform.y));
        
        const clampedTransform = d3.zoomIdentity
            .translate(clampedX, clampedY)
            .scale(transform.k);
        
        mainGroup.attr("transform", clampedTransform);
        updateAxesPositions(clampedTransform);
        zoomLevel = transform.k;

let currentLeftScore = 0;
let currentRightScore = 0;

// Update score validation to use dynamic maxScore
function updateScore(team) {
    const teamSelect = document.getElementById(team === 'left' ? 'teamLeft' : 'teamRight');
    const teamCode = teamSelect.value;
    const teamName = teamCode ? getCurrentTeams()[teamCode].name : (team === 'left' ? 'Left' : 'Right') + ' Team';

    showGenericPrompt({
        title: 'Update Score',
        message: `Enter new score for ${teamCode}`,
        inputType: 'number',
        maxLength: String(maxScore).length,
        minValue: 0,
        maxValue: maxScore,
        validateInput: (value) => {
            if (!value) {
                return { isValid: false, message: 'Enter score or cancel' };
            }
            if (!/^\d+$/.test(value)) {
                return { isValid: false, message: 'Enter numbers' };
            }
            const score = parseInt(value);
            if (isNaN(score)) {
                return { isValid: false, message: 'Enter valid number' };
            }
            if (score < 0 || score > maxScore) {
                return { isValid: false, message: `Score between 0 and ${maxScore}` };
            }
            return { isValid: true };
        },
        onConfirm: (value) => {
            const score = parseInt(value);
            if (team === 'left') {
                currentLeftScore = score;
                document.getElementById('leftScore').textContent = currentLeftScore;
            } else {
                currentRightScore = score;
                document.getElementById('rightScore').textContent = currentRightScore;
            }

            fetch('/api/scores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    left: currentLeftScore,
                    right: currentRightScore
                })
            })
            .then(response => response.json())
            .then(data => {
                if (!data.success) {
                    showAlert('Failed to save scores');
                }
                highlightCurrentScore();
                updateWinnerDisplay();
            })
            .catch(error => {
                console.error('Error saving scores:', error);
                showAlert('Failed to save scores');
            });
        }
    });
}

// Function to highlight winner and path
// winnerData can be a single winner object or an array of winners
function highlightWinner(winnerData) {
    // Remove all winner highlights
    d3.selectAll('.square').classed('winner-path', false);
    d3.selectAll('.square').classed('winner-square', false);

    if (!winnerData) {
        console.log('No winner to highlight (tie or no bets)');
        return; // No winner to highlight
    }

    // Convert to array if single winner
    const winners = Array.isArray(winnerData) ? winnerData : [winnerData];

    console.log(`Highlighting ${winners.length} winner(s)`);

    // Process each winner
    winners.forEach((winner, index) => {
        console.log(`  Winner ${index + 1}: ${winner.player} at (${winner.square.row},${winner.square.col}), distance=${winner.distance}`);

        // Highlight the path squares
        if (winner.path && winner.path.length > 0) {
            console.log(`    Highlighting ${winner.path.length} path squares`);
            winner.path.forEach(square => {
                const element = d3.select(`rect[data-row="${square.row}"][data-col="${square.col}"]`);
                element.classed('winner-path', true);
            });
        }

        // Highlight the winning square with gold border
        if (winner.square) {
            const element = d3.select(`rect[data-row="${winner.square.row}"][data-col="${winner.square.col}"]`);
            element.classed('winner-square', true);
        }
    });
}

// Function to update winner display
function updateWinnerDisplay() {
    fetch('/api/winner')
        .then(response => response.json())
        .then(data => {
            if (data.success && data.winner) {
                highlightWinner(data.winner);
            } else {
                highlightWinner(null);
            }
        })
        .catch(error => {
            console.error('Error fetching winner:', error);
        });
}

// Update the createGrid function to add data attributes to the squares
function createGrid() {
  // Clear existing elements
  mainGroup.selectAll("*").remove();
  Object.values(axesGroups).forEach(group => group.selectAll("*").remove());

  const squaresGroup = mainGroup.append("g");

  // Create scales for grid positioning
  const xScale = d3.scaleLinear()
    .domain([0, maxScore])
    .range([0, maxScore * currentSize]);

  const yScale = d3.scaleLinear()
    .domain([0, maxScore])
    .range([0, maxScore * currentSize]);

  // Create header cells for scores (0-9)
  // Top header (horizontal)
  for (let i = 0; i <= maxScore; i++) {
    squaresGroup.append("rect")
      .attr("class", "square header-square")
      .attr("x", i * currentSize)
      .attr("y", -currentSize) // Position above main grid
      .attr("width", currentSize)
      .attr("height", currentSize)
      .attr("fill", "var(--retro-bg)")
      .attr("stroke", "var(--retro-primary)");
    squaresGroup.append("text")
      .attr("class", "square-text header-text")
      .attr("x", i * currentSize + currentSize / 2)
      .attr("y", -currentSize / 2)
      .attr("text-anchor", "middle")
      .attr("dominant-baseline", "middle")
      .style("fill", "var(--retro-primary)")
      .style("font-size", "12px")
      .text(i);
  }

  // Left header (vertical)
  for (let i = 0; i <= maxScore; i++) {
    squaresGroup.append("rect")
      .attr("class", "square header-square")
      .attr("x", -currentSize) // Position left of main grid
      .attr("y", i * currentSize)
      .attr("width", currentSize)
      .attr("height", currentSize)
      .attr("fill", "var(--retro-bg)")
      .attr("stroke", "var(--retro-primary)");
    squaresGroup.append("text")
      .attr("class", "square-text header-text")
      .attr("x", -currentSize / 2)
      .attr("y", i * currentSize + currentSize / 2)
      .attr("text-anchor", "middle")
      .attr("dominant-baseline", "middle")
      .style("fill", "var(--retro-primary)")
      .style("font-size", "12px")
      .text(i);
  }

  // Create main grid squares
  for (let row = 0; row <= maxScore; row++) {
    for (let col = 0; col <= maxScore; col++) {
      const isTieSquare = row === col;

      // Create square
      squaresGroup.append("rect")
        .attr("class", `square ${isTieSquare ? 'tie-square' : ''}`)
        .attr("x", col * currentSize)
        .attr("y", row * currentSize)
        .attr("width", currentSize)
        .attr("height", currentSize)
        .attr("data-row", row)
        .attr("data-col", col)
        .on("click", () => !isTieSquare && handleSquareClick(row, col))
        .on("contextmenu", (event) => {
          event.preventDefault();
          if (!isTieSquare) handleSquareDelete(row, col);
        });

      // Add text for squares
      squaresGroup.append("text")
        .attr("class", `square-text ${isTieSquare ? 'tie-text' : ''}`)
        .attr("x", col * currentSize + currentSize / 2)
        .attr("y", row * currentSize + currentSize / 2)
        .attr("data-row", row)
        .attr("data-col", col)
        .style("font-size", "12px")
        .text(isTieSquare ? row : '');
    }
  }

  // Event delegation for hover - one handler instead of 100+ individual handlers
  squaresGroup
    .on("mouseover", (event) => {
      const target = event.target;
      if (target.classList.contains("square")) {
        const row = target.getAttribute("data-row");
        const col = target.getAttribute("data-col");
        // Skip header squares (no data attributes)
        if (row === null || col === null) return;
        // Tie squares (diagonal) - show TIE
        const isTie = row === col;
        const text = isTie
          ? `TIE: ${row} - ${col}`
          : `${teamLeftInput.value}: ${row}  |  ${teamRightInput.value}: ${col}`;
        tooltip.style("opacity", 1)
          .text(text)
          .style("left", (event.pageX + 10) + "px")
          .style("top", (event.pageY - 10) + "px");
      }
    })
    .on("mouseout", (event) => {
      if (event.target.classList.contains("square")) {
        tooltip.style("opacity", 0);
      }
    });

  // Update team names with adjusted positioning
  const teamNameOffset = currentSize * 1.5; // Increased offset to account for score cells
  resetZoom();
  // Add this line at the end of the function
  setTimeout(highlightCurrentScore, 100); // Small delay to ensure DOM is updated
}

function addPlayer() {
    const initialInput = document.getElementById('playerInitial');
    const nameInput = document.getElementById('playerName');
    const initial = initialInput.value.toUpperCase();
    const name = nameInput.value.trim().toUpperCase();

    // Validate initial
    if (initial.length !== 1) {
        showAlert("Enter Initial");
        return;
    }

    // Validate name length and content
    if (!name) {
        showAlert("Enter name");
        return;
    }
    
    if (name.length > 8) {
        showAlert("Name is max 8 char");
        nameInput.value = name.substring(0, 8);
        return;
    }

    // Check for duplicate initial
    if (players[initial]) {
        showAlert(`Initial ${initial} owned by ${players[initial].name}`);
        return;
    }

    // Add player via API
    fetch('/api/players', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initial, name })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            players[initial] = {
                name: name,
                playerIndex: data.playerIndex,  // Changed from colorIndex
                bets: 0,
                tokens: tokensPerPlayer  // Initialize with tokens for current sport
            };
            updatePlayerList();
            initialInput.value = '';
            nameInput.value = '';
        } else {
            showAlert(data.error || "Failed to add player");
        }
    })
    .catch(error => {
        console.error("Error adding player:", error);
        showAlert("Failed to add player");
    });
}

// Add these helper functions for contrast checking
function getLuminance(r, g, b) {
    let [rs, gs, bs] = [r, g, b].map(c => {
        c = c / 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
}

function getContrastRatio(color1, color2) {
    // Convert hex to RGB
    const getRGB = (hex) => {
        const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
        hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null;
    };

    const rgb1 = getRGB(color1);
    const rgb2 = getRGB(color2);
    
    if (!rgb1 || !rgb2) return 1;

    const l1 = getLuminance(rgb1.r, rgb1.g, rgb1.b);
    const l2 = getLuminance(rgb2.r, rgb2.g, rgb2.b);
    
    const lighter = Math.max(l1, l2);
    const darker = Math.min(l1, l2);
    
    return (lighter + 0.05) / (darker + 0.05);
}

// Player list update function with alphabetical sorting
function updatePlayerList() {
    const playerList = document.getElementById('playerList');
    playerList.innerHTML = '';
    
    // Convert players object to array and sort alphabetically by initial
    const sortedPlayers = Object.entries(players)
        .sort(([initialA], [initialB]) => initialA.localeCompare(initialB));
    
    sortedPlayers.forEach(([initial, info]) => {
        const playerItem = document.createElement('div');
        playerItem.className = 'player-item';
        
        const colorDot = document.createElement('div');
        colorDot.className = 'color-dot';
        colorDot.style.backgroundColor = playerColorScale(info.playerIndex); 
        
        const playerInfo = document.createElement('div');
        playerInfo.className = 'player-info';
        playerInfo.style.fontSize = '12px';
        playerInfo.style.whiteSpace = 'nowrap';
        playerInfo.style.overflow = 'hidden';
        playerInfo.style.textOverflow = 'ellipsis';
        playerInfo.style.maxWidth = '200px';
        playerInfo.textContent = `${initial}-${info.name}-${info.tokens || 0}`;
        
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = 'X';
        deleteBtn.style.fontSize = '12px';
        deleteBtn.style.padding = '2px 4px';
        deleteBtn.onclick = () => deletePlayer(initial);
        
        playerItem.appendChild(colorDot);
        playerItem.appendChild(playerInfo);
        playerItem.appendChild(deleteBtn);
        playerList.appendChild(playerItem);
    });
}


function deletePlayer(initial) {
    const playerName = players[initial]?.name || 'Unknown Player';
    
    showAlert(
        `Player: ${initial} - ${playerName}`,
        'Delete Player',
        true,
        (confirmed) => {
            if (confirmed) {
                // Delete player via API
                fetch(`/api/players/${initial}`, {
                    method: 'DELETE',
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Remove from local players object
                        delete players[initial];
                        // Update the player list display
                        updatePlayerList();
                        // Clear any squares with this player's initial
                        d3.selectAll('.square-text')
                            .filter(function() {
                                return d3.select(this).text() === initial;
                            })
                            .each(function() {
                                const row = d3.select(this).attr('data-row');
                                const col = d3.select(this).attr('data-col');
                                updateSquare(row, col, '');
                            });
                    } else {
                        showAlert(data.error || "Failed to delete player");
                    }
                })
                .catch(error => {
                    console.error("Error deleting player:", error);
                    showAlert("Failed to delete player");
                });
            }
        }
    );
}


function handleSquareClick(row, col) {
    if (row === col) return; // Prevent tie square interaction

    const currentValue = d3.select(`text[data-row='${row}'][data-col='${col}']`).text();
    if (currentValue) {
        showAlert(`Owned by ${currentValue}`, 'Square taken');
        return;
    }

    // Create player list content
    const playerList = Object.keys(players)
        .sort() // Sort the initials alphabetically
		.map(initial => `${initial}`)
        .join(',');

    showGenericPrompt({
        title: 'Select Player',
        message: 'Player initial',
        maxLength: 1,
        showPlayerList: true,
        playerListContent: 'AVAILABLE PLAYERS:\n' + playerList,
        validateInput: (value) => {
            const initial = value.trim().toUpperCase();
            if (initial.length !== 1) {
                return { isValid: false, message: 'Initial must be 1 letter' };
            }
            if (!players[initial]) {
                return { isValid: false, message: 'Please register first' };
            }
            return { isValid: true };
        },
        onConfirm: (value) => {
            const initial = value.trim().toUpperCase();

            // Update square via API
            fetch('/api/squares', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ row, col, value: initial })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateSquare(row, col, initial);
                    // Update player tokens for all affected players
                    if (data.updated_players) {
                        for (const [playerInitial, tokens] of Object.entries(data.updated_players)) {
                            if (players[playerInitial]) {
                                players[playerInitial].tokens = tokens;
                            }
                        }
                    }
                    // Update player list to show new token counts
                    updatePlayerList();
                    // Update winner display in case this bet affects the winner
                    updateWinnerDisplay();
                } else {
                    showAlert(data.error || 'Failed to update square');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showAlert('Failed to update square');
            });
        }
    });
}

// Generic prompt method for input dialogs
function showGenericPrompt({
    title = 'Input Required',
    message = '',
    defaultValue = '',
    inputType = 'text',
    maxLength = null,
    minValue = null,
    maxValue = null,
    showPlayerList = false,
    playerListContent = '',
    validateInput = null,
    onConfirm = null,
    onCancel = null
}) {
    const genericPrompt = document.getElementById('genericPrompt');
    const promptTitle = document.getElementById('genericPromptTitle');
    const promptMessage = document.getElementById('genericPromptMessage');
    const promptInput = document.getElementById('genericPromptInput');
    const promptPlayerList = document.getElementById('genericPromptPlayerList');
    const okBtn = document.getElementById('genericPromptOkBtn');
    const cancelBtn = document.getElementById('genericPromptCancelBtn');

    // Set up prompt content
    promptTitle.textContent = title.toUpperCase();
    promptMessage.textContent = message.toUpperCase();
    promptInput.value = defaultValue;
    promptInput.type = inputType;
    
    if (maxLength !== null) promptInput.maxLength = maxLength;
    if (minValue !== null) promptInput.min = minValue;
    if (maxValue !== null) promptInput.max = maxValue;

    // Handle player list visibility
    promptPlayerList.style.display = showPlayerList ? 'block' : 'none';
    if (showPlayerList) {
        promptPlayerList.textContent = playerListContent;
    }

    // Show prompt
    genericPrompt.style.display = 'flex';
    promptInput.focus();

    // Input validation handler
    const handleValidation = (value) => {
        if (!validateInput) return { isValid: true };
        const result = validateInput(value);
        if (!result.isValid) {
            // Hide prompt temporarily
            genericPrompt.style.display = 'none';
            
            // Show error alert
            showAlert(result.message, 'Invalid Input', false, () => {
                // After alert is dismissed, show prompt again
                genericPrompt.style.display = 'flex';
                promptInput.value = '';
                promptInput.focus();
            });
        }
        return result;
    };

    // Input event handler
    promptInput.oninput = (e) => {
        const value = e.target.value;
        if (!value) return; // Allow empty for backspace
        handleValidation(value);
    };

    // Keyboard event handler
    promptInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            okBtn.click();
        } else if (e.key === 'Escape') {
            e.preventDefault();
            cancelBtn.click();
        }
    };

    // Button handlers
    okBtn.onclick = () => {
        const value = promptInput.value.trim();
        const validationResult = handleValidation(value);
        
        if (validationResult.isValid) {
            genericPrompt.style.display = 'none';
            promptInput.type = 'text'; // Reset input type
            promptPlayerList.style.display = 'block'; // Reset player list display
            if (onConfirm) onConfirm(value);
        }
    };

    cancelBtn.onclick = () => {
        genericPrompt.style.display = 'none';
        promptInput.type = 'text'; // Reset input type
        promptPlayerList.style.display = 'block'; // Reset player list display
        if (onCancel) onCancel();
    };
}

// Generic alert method for messages and confirmations
function showAlert(message, title = null, showCancel = false, callback = null) {
    const genericAlert = document.getElementById('genericAlert');
    const alertTitle = document.getElementById('genericAlertTitle');
    const alertMessage = document.getElementById('genericAlertMessage');
    const okBtn = document.getElementById('genericAlertOkBtn');
    const cancelBtn = document.getElementById('genericAlertCancelBtn');
    
    if (title === null) {
        // If only message is provided, use it as title and hide message
        alertTitle.textContent = message.toUpperCase();
        alertMessage.style.display = 'none';
    } else {
        // If both title and message are provided, show both
        alertTitle.textContent = title.toUpperCase();
        alertMessage.textContent = message.toUpperCase();
        alertMessage.style.display = 'block';
    }
    
    cancelBtn.style.display = showCancel ? 'inline-block' : 'none';
    genericAlert.style.display = 'flex';
    
    okBtn.onclick = () => {
        genericAlert.style.display = 'none';
        if (callback) callback(true);
    };
    
    cancelBtn.onclick = () => {
        genericAlert.style.display = 'none';
        if (callback) callback(false);
    };
}

function handleSquareDelete(row, col) {
    if (row === col) return; // Can't delete tie squares
    
    const currentValue = d3.select(`text[data-row='${row}'][data-col='${col}']`).text();
    if (!currentValue) return; // No need to confirm if square is empty
    
    const playerName = players[currentValue]?.name || 'Unknown Player';
    showAlert(
        `Player: ${currentValue} - ${playerName}`, 'Delete Square',
        true,
        (confirmed) => {
            if (confirmed) {
                fetch('/api/squares', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ row, col, value: '' })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        updateSquare(row, col, '');
                        // Update player tokens for all affected players
                        if (data.updated_players) {
                            for (const [playerInitial, tokens] of Object.entries(data.updated_players)) {
                                if (players[playerInitial]) {
                                    players[playerInitial].tokens = tokens;
                                }
                            }
                        }
                        // Update player list to show new token counts
                        updatePlayerList();
                        // Update winner display since removing a bet might change the winner
                        updateWinnerDisplay();
                    } else {
                        showAlert(data.error || "Failed to delete square");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    showAlert("Failed to delete square");
                });
            }
        }
    );
}

// Update square display function with proper color handling
function updateSquare(row, col, value) {
    const text = d3.select(`text[data-row='${row}'][data-col='${col}']`);
    if (text.empty()) return;

    // Get current value before update
    const currentValue = text.text();
    
    // Convert value to uppercase before display
    const displayValue = value ? value.toUpperCase() : '';
    
    // Update bet counts if needed
    if (currentValue && players[currentValue]) {
        // Decrement bet count for previous player
        players[currentValue].bets = Math.max(0, (players[currentValue].bets || 0) - 1);
    }
    
    if (displayValue && players[displayValue]) {
        // Increment bet count for new player
        players[displayValue].bets = (players[displayValue].bets || 0) + 1;
    }
    
    // Set text and color
    text.text(displayValue);
    
    // Only apply color if there's a value and it belongs to a player
    if (displayValue && players[displayValue]) {
        text.style("fill", playerColorScale(players[displayValue].playerIndex));
    } else {
        text.style("fill", "var(--retro-primary)");
    }
        
    // Update player list to reflect new bet counts
    updatePlayerList();
}

// Get team colors for celebration based on winning team
function getTeamColors(winningTeam) {
    const leftTeamCode = document.getElementById('teamLeft').value;
    const rightTeamCode = document.getElementById('teamRight').value;
    const teams = getCurrentTeams();

    const leftTeam = teams[leftTeamCode];
    const rightTeam = teams[rightTeamCode];

    // Get colors from each team
    const leftColors = [
        leftTeam?.colors?.[0] || '#FFD700',
        leftTeam?.colors?.[1] || '#FFA500'
    ];
    const rightColors = [
        rightTeam?.colors?.[0] || '#4ECDC4',
        rightTeam?.colors?.[1] || '#45B7D1'
    ];

    // Return winning team colors first, then losing team colors
    if (winningTeam === 'left') {
        return { winner: leftColors, loser: rightColors };
    } else {
        return { winner: rightColors, loser: leftColors };
    }
}

// Show celebration overlay with Excitebike-style podium
function showCelebration(standings, winningTeam) {
    const teamColors = getTeamColors(winningTeam);

    // Find the minimum distance (winner distance)
    const winnerDistance = standings[0]?.distance || 0;

    // Get winners (all entries with minimum distance) - unique player names only, sorted
    const winners = standings.filter(s => s.distance === winnerDistance);
    const uniqueWinnerNames = [...new Set(winners.map(w => players[w.player]?.name || w.player_name || w.player))].sort();
    const winnerNames = uniqueWinnerNames.length === 2
        ? uniqueWinnerNames.join(' & ')
        : uniqueWinnerNames.join(', ');

    // Build podium HTML - top 5, group by distance, show rank
    const top5 = standings.slice(0, 5);
    let currentRank = 1;
    let lastDistance = -1;

    // Get team info for score display
    const leftTeamCode = document.getElementById('teamLeft').value;
    const rightTeamCode = document.getElementById('teamRight').value;

    // Get final game score
    const finalLeftScore = currentLeftScore;
    const finalRightScore = currentRightScore;

    const podiumHtml = top5.map((entry, index) => {
        // Update rank when distance changes
        if (entry.distance !== lastDistance) {
            currentRank = index + 1;
            lastDistance = entry.distance;
        }

        const isWinner = entry.distance === winnerDistance;
        const playerName = players[entry.player]?.name || entry.player_name || entry.player;
        const distanceText = entry.distance === 0 ? 'PERFECT!' : `+${entry.distance}`;
        const scoreText = `${leftTeamCode} ${entry.square.row} - ${rightTeamCode} ${entry.square.col}`;
        const multiplierText = `${entry.multiplier || 1}x`;

        return `
            <div class="podium-entry ${isWinner ? 'winner' : 'other'}">
                <span class="podium-rank">${currentRank}.</span>
                <span class="podium-name">${playerName}</span>
                <span class="podium-multiplier">${multiplierText}</span>
                <span class="podium-score">${scoreText}</span>
                <span class="podium-distance">${distanceText}</span>
            </div>
        `;
    }).join('');

    // Create celebration overlay with winning team color gradient background
    const overlay = document.createElement('div');
    overlay.className = 'celebration-overlay';
    overlay.style.background = `linear-gradient(135deg, ${teamColors.winner[0]}ee 0%, ${teamColors.winner[1]}ee 100%)`;
    overlay.innerHTML = `
        <div class="celebration-fireworks fireworks-left" id="fireworksLeft"></div>
        <div class="celebration-fireworks fireworks-right" id="fireworksRight"></div>
        <div class="celebration-content">
            <div class="celebration-trophy"><img src="/static/trophy3.png" alt="Trophy"></div>
            <div class="celebration-winner-banner">
                <div class="winner-label">WINNER</div>
                <div class="winner-name">${winnerNames}</div>
            </div>
            <div class="celebration-final-score">
                <span class="final-score-team">${leftTeamCode}</span>
                <span class="final-score-value">${finalLeftScore}</span>
                <span class="final-score-separator">-</span>
                <span class="final-score-value">${finalRightScore}</span>
                <span class="final-score-team">${rightTeamCode}</span>
            </div>
            <div class="celebration-title">TOP 5 SQUARES</div>
            <div class="celebration-podium">
                ${podiumHtml}
            </div>
            <div class="celebration-actions">
                <button class="celebration-btn reset-btn" id="celebrationResetBtn">RESET</button>
                <button class="celebration-btn cancel-btn" id="celebrationCancelBtn">CANCEL</button>
            </div>
        </div>
    `;

    document.body.appendChild(overlay);

    // Add confetti and fireworks - only winning team colors
    if (isLiteMode) {
        // Lite mode: add static 8-bit decorations
        createStaticDecorations(overlay, teamColors.winner);
    } else {
        // Normal mode: animated effects
        createConfetti(overlay, teamColors.winner);
        createFireworks(overlay.querySelector('#fireworksLeft'), teamColors.winner, 'left');
        createFireworks(overlay.querySelector('#fireworksRight'), teamColors.winner, 'right');
    }

    // Add click handlers for buttons
    overlay.querySelector('#celebrationResetBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        document.body.removeChild(overlay);
        resetGame(true);
    });

    overlay.querySelector('#celebrationCancelBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        document.body.removeChild(overlay);
    });
}

// Create confetti particles
function createConfetti(container, teamColors = null) {
    // Skip confetti in lite mode
    if (isLiteMode) return;

    // Use team colors if provided, otherwise fall back to defaults
    const colors = teamColors || ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1'];

    for (let i = 0; i < 50; i++) {
        setTimeout(() => {
            const confetti = document.createElement('div');
            confetti.className = 'celebration-confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.animationDelay = Math.random() * 2 + 's';
            container.appendChild(confetti);

            // Remove confetti after animation
            setTimeout(() => {
                if (confetti.parentNode) {
                    confetti.parentNode.removeChild(confetti);
                }
            }, 5000);
        }, i * 100);
    }
}

// Create fireworks with team colors
function createFireworks(container, teamColors, side = 'full') {
    // Skip fireworks in lite mode
    if (isLiteMode) return;

    const colors = teamColors || ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1'];

    function launchFirework() {
        const firework = document.createElement('div');
        firework.className = 'firework';

        // Random position within the container
        const x = 10 + Math.random() * 80;
        const y = 10 + Math.random() * 80;
        firework.style.left = x + '%';
        firework.style.top = y + '%';

        // Create burst particles
        const particleCount = 12;
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'firework-particle';
            const angle = (i / particleCount) * 360;
            const color = colors[Math.floor(Math.random() * colors.length)];
            particle.style.setProperty('--angle', angle + 'deg');
            particle.style.backgroundColor = color;
            particle.style.boxShadow = `0 0 6px ${color}, 0 0 12px ${color}`;
            firework.appendChild(particle);
        }

        container.appendChild(firework);

        // Remove after animation
        setTimeout(() => {
            if (firework.parentNode) {
                firework.parentNode.removeChild(firework);
            }
        }, 1500);
    }

    // Launch fireworks periodically - stagger left and right
    const delay = side === 'right' ? 200 : 0;
    setTimeout(() => {
        const fireworkInterval = setInterval(launchFirework, 700);
        launchFirework(); // Initial firework

        // Stop after 10 seconds
        setTimeout(() => clearInterval(fireworkInterval), 10000);
    }, delay);
}

    });

        { x: 90, y: 32, size: 'medium' }, { x: 95, y: 65, size: 'medium' },
    ];

    fireworkPositions.forEach((pos, i) => {
        const firework = document.createElement('div');
        firework.className = 'static-firework';
        firework.style.left = pos.x + '%';
        firework.style.top = pos.y + '%';

        const isLarge = pos.size === 'large';
        const baseSize = isLarge ? 120 : 70;
        firework.style.width = baseSize + 'px';
        firework.style.height = baseSize + 'px';

        const color = colors[i % colors.length];
        const altColor = colors[(i + 1) % colors.length];

        // Large center pixel cluster (3x3 for big, 2x2 for medium)
        const centerSize = isLarge ? 12 : 8;
        const center = document.createElement('div');
        center.className = 'static-firework-center';
        center.style.backgroundColor = color;
        center.style.width = centerSize + 'px';
        center.style.height = centerSize + 'px';
        firework.appendChild(center);

        // Inner ring pixels around center
        const innerDist = isLarge ? 14 : 10;
        const innerPositions = [
            { dx: 0, dy: -innerDist }, { dx: 0, dy: innerDist },
            { dx: -innerDist, dy: 0 }, { dx: innerDist, dy: 0 },
        ];
        innerPositions.forEach(p => {
            const pixel = document.createElement('div');
            pixel.className = 'static-firework-ray';
            pixel.style.backgroundColor = color;
            pixel.style.width = '6px';
            pixel.style.height = '6px';

            pixel.style.top = `calc(50% + ${p.dy}px - 3px)`;

        // Main rays - 8 directions with multiple pixels each

        rays.forEach((ray, j) => {
            const isCardinal = j < 4;
            const numPixels = isLarge ? (isCardinal ? 5 : 4) : (isCardinal ? 4 : 3);

            for (let k = 1; k <= numPixels; k++) {

                pixel.className = 'static-firework-ray';

                pixel.style.backgroundColor = k % 2 === 0 ? altColor : color;

                pixel.style.width = Math.max(pixelSize, 3) + 'px';
                pixel.style.height = Math.max(pixelSize, 3) + 'px';
                pixel.style.left = `calc(50% + ${ray.dx * dist}px - ${pixelSize/2}px)`;
                pixel.style.top = `calc(50% + ${ray.dy * dist}px - ${pixelSize/2}px)`;
                // Fade out toward tips
                pixel.style.opacity = 1 - (k * 0.15);
                firework.appendChild(pixel);

        });

        // Add extra sparkle pixels scattered around for large fireworks
        if (isLarge) {
            const sparkles = [
                { dx: 25, dy: -35 }, { dx: -30, dy: -30 }, { dx: 35, dy: 25 }, { dx: -25, dy: 35 },
                { dx: 40, dy: -15 }, { dx: -40, dy: 15 }, { dx: 15, dy: 40 }, { dx: -15, dy: -40 },

    // Add bigger star/sparkle shapes

        { x: 22, y: 8 }, { x: 78, y: 10 },
        { x: 20, y: 92 }, { x: 80, y: 90 },
        { x: 25, y: 40 }, { x: 75, y: 38 },
        { x: 23, y: 65 }, { x: 77, y: 62 },
    ];

    starPositions.forEach((pos, i) => {
        const star = document.createElement('div');
        star.className = 'static-firework';
        star.style.left = pos.x + '%';
        star.style.top = pos.y + '%';
        star.style.width = '50px';
        star.style.height = '50px';

        const color = colors[i % colors.length];
        const altColor = colors[(i + 1) % colors.length];

        // 4-point star with extended rays
        const starRays = [
            { dx: 0, dy: -20, size: 5 },
            { dx: 0, dy: 20, size: 5 },
            { dx: -20, dy: 0, size: 5 },
            { dx: 20, dy: 0, size: 5 },
            { dx: 0, dy: -12, size: 4 },
            { dx: 0, dy: 12, size: 4 },
            { dx: -12, dy: 0, size: 4 },
            { dx: 12, dy: 0, size: 4 },
            // Diagonal accents
            { dx: -10, dy: -10, size: 3 },
            { dx: 10, dy: -10, size: 3 },
            { dx: -10, dy: 10, size: 3 },
            { dx: 10, dy: 10, size: 3 },
        ];

        // Center cluster
        const starCenter = document.createElement('div');
        starCenter.style.position = 'absolute';
        starCenter.style.width = '8px';
        starCenter.style.height = '8px';
        starCenter.style.backgroundColor = color;
        starCenter.style.left = 'calc(50% - 4px)';
        starCenter.style.top = 'calc(50% - 4px)';
        star.appendChild(starCenter);

        starRays.forEach((ray, j) => {
            const pixel = document.createElement('div');
            pixel.className = 'static-firework-ray';
            pixel.style.backgroundColor = j < 4 ? color : (j < 8 ? altColor : color);
            pixel.style.width = ray.size + 'px';
            pixel.style.height = ray.size + 'px';
            pixel.style.left = `calc(50% + ${ray.dx}px - ${ray.size/2}px)`;
            pixel.style.top = `calc(50% + ${ray.dy}px - ${ray.size/2}px)`;
            if (j >= 8) pixel.style.opacity = '0.7';
            star.appendChild(pixel);
        });

        decorations.appendChild(star);
    });

    container.appendChild(decorations);
}

                                <h2 class="alert-title">${isNewGame ? 'STARTING NEW GAME' : 'RESETTING GAME'}</h2>
                                <div class="loading-dots">
                                    <span></span><span></span><span></span>
                                </div>
                            </div>
                        `;
                        document.body.appendChild(loadingOverlay);

                        try {
                            // First update the sport
                            const sportResponse = await fetch('/api/sport', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ sport: sport })
                            });
                            const sportData = await sportResponse.json();
                            if (!sportData.success) {
                                throw new Error('Failed to update sport');
                            }

                            // Then reset the game
                            const resetResponse = await fetch('/api/reset', {
                                method: 'POST'
                            });
                            const resetData = await resetResponse.json();
                            if (!resetData.success) {
                                throw new Error('Failed to reset game');
                            }

                            // Update UI after both operations complete successfully
                            setSportTheme(sport);
                            players = {};
                            updatePlayerList();
                            document.getElementById('leftScore').textContent = '0';
                            document.getElementById('rightScore').textContent = '0';
							currentLeftScore = 0;  // Explicitly reset these variables
							currentRightScore = 0;
                            document.getElementById('teamLeft').value = '';
                            document.getElementById('teamRight').value = '';
                            createGrid();
                            highlightCurrentScore();

                            if (isNewGame) {
                                document.getElementById('landing-overlay').style.display = 'none';
                            }
                            
                            showAlert(isNewGame ? 'Game started' : 'Reset completed');
                        } catch (error) {
                            console.error(`Error ${isNewGame ? 'starting' : 'resetting'} game:`, error);
                            showAlert(`Failed to ${isNewGame ? 'start' : 'reset'} game`);
                        } finally {
                            document.body.removeChild(loadingOverlay);
                        }
                    });
                });
            }
        }
    );
}

// Handle window resize
window.addEventListener('resize', () => {
    const newWidth = gridContainer.clientWidth;
    const newHeight = gridContainer.clientHeight;
    svg.attr("viewBox", [-margin.left, -margin.top, 
        newWidth + margin.left + margin.right, 
        newHeight + margin.top + margin.bottom]);
});


document.addEventListener('DOMContentLoaded', () => {
    // Get references to elements
    const newGameBtn = document.getElementById('newGameBtn');
    const loadGameBtn = document.getElementById('loadGameBtn');
    const landingOverlay = document.getElementById('landing-overlay');
    const sportSelection = document.querySelector('.sport-selection');
    const mainButtons = document.getElementById('mainButtons');
    const backToMainBtn = document.getElementById('backToMainBtn');

    // New Game button click
	newGameBtn.addEventListener('click', () => resetGame(true));

    // Back button click
    backToMainBtn.addEventListener('click', () => {
        sportSelection.style.display = 'none';
        mainButtons.style.display = 'flex';
    });

    // Add click handlers for sport boxes in the landing page
    document.querySelectorAll('.sport-box').forEach(box => {
        box.addEventListener('click', () => {
            const sport = box.dataset.sport;
            setSportTheme(sport);
        });
    });

	// Update loadGameBtn click handler to handle max score
	loadGameBtn.addEventListener('click', () => {
		// Show loading indicator
		const loadingOverlay = document.createElement('div');
		loadingOverlay.className = 'alert-overlay';
		loadingOverlay.style.display = 'flex';
		loadingOverlay.innerHTML = `
			<div class="alert-content">
				<h2 class="alert-title">LOADING GAME</h2>
				<div class="loading-dots">
					<span></span><span></span><span></span>
				</div>
			</div>
		`;
		document.body.appendChild(loadingOverlay);

		fetch('/api/state', {
			method: 'GET'
		})
		.then(response => {
			if (!response.ok) {
				throw new Error(`HTTP error! status: ${response.status}`);
			}
			return response.json();
		})
		.then(data => {
			// Validate required data
			if (!data || !data.squares || !data.players ||
				!data.teams || !data.scores || !data.sport ||
				!data.max_score) {
				throw new Error('Invalid or incomplete game state');
			}

			// Set sport theme first but skip the API call
			setSportTheme(data.sport, true);
			maxScore = data.max_score;

			// Load multiplier data
			currentMultiplier = data.current_multiplier || 1;
			availableMultipliers = data.available_multipliers || [1];
			multiplierLabels = data.multiplier_labels || [];
			tokensPerPlayer = data.tokens_per_player || 40;
			updateMultiplierButtons();

			// Load players
			players = data.players;
			updatePlayerList();

			// Load teams
			const teamLeft = document.getElementById('teamLeft');
			const teamRight = document.getElementById('teamRight');
			
			if (teamLeft && teamRight) {
				teamLeft.value = data.teams.left || '';
				teamRight.value = data.teams.right || '';
				updateTeamColors(); // Update team visuals
			}

			// Load scores
			currentLeftScore = Math.min(data.scores.left, maxScore);
			currentRightScore = Math.min(data.scores.right, maxScore);
			document.getElementById('leftScore').textContent = currentLeftScore;
			document.getElementById('rightScore').textContent = currentRightScore;

			// Recreate grid with new maxScore
			createGrid();

			// Update squares data
			for (let row = 0; row <= maxScore; row++) {
				for (let col = 0; col <= maxScore; col++) {
					if (row === col) continue; // Skip tie squares
					const value = data.squares[row] && data.squares[row][col] ? 
						data.squares[row][col] : '';
					updateSquare(row, col, value);
				}
			}

			// Update visual states
			highlightCurrentScore();

			// Update winner display if there's winner data
			if (data.winner) {
				highlightWinner(data.winner);
			}

			// Hide overlays
			document.getElementById('landing-overlay').style.display = 'none';
			document.body.removeChild(loadingOverlay);

			// Show success message
			showAlert('Game loaded successfully');
		})
		.catch(error => {
			console.error('Error loading game state:', error);
			showAlert('Failed to load game state: ' + error.message);
			document.body.removeChild(loadingOverlay);
		});
	});

    // Then populate the team selects
    populateTeamSelects();

    // Initialize multiplier buttons
    updateMultiplierButtons();
});

    </script>
</body>
</html>
