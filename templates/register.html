<!DOCTYPE html>
<html lang="en" data-public="true">
<head>
    <meta charset="utf-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ asset_url('js/request-security.js') }}"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Join Championship Squares</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="registration-page">
    <main class="registration-card">
        <h1>JOIN GAME</h1>
        <p>CREATE YOUR PLAYER</p>
        <form id="registrationForm" data-registration-token="{{ token }}">
            <input id="initial" aria-label="Player initial" maxlength="1" pattern="[A-Za-z]" placeholder="ID" required>
            <input id="name" aria-label="Player name" maxlength="8" placeholder="NAME" required>
            <button class="landing-btn">CREATE & PLAY</button>
        </form>
        <p id="status" role="status"></p>
        <a id="rejoin" class="join-game-link" hidden>URL LINK</a>
    </main>
    <script src="{{ asset_url('js/register.js') }}"></script>
</body>
</html>
