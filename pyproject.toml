[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "championship-squares"
version = "2026.07"
description = "Small web app to run a Championship Squares game"
authors = [{name = "Stephane Belliveau"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask==3.1.2",
]

[project.optional-dependencies]
dev = [
    "requests==2.32.5",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "flake8==7.3.0",
    "pip-audit==2.10.0",
]

[tool.setuptools]
py-modules = ["app", "config", "database"]
